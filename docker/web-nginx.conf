server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html is what points at the current asset hashes, so it must never be held. Set here rather than on
    # one location because try_files delivers a file without re-matching a location; /assets/ overrides it.
    add_header Cache-Control "no-cache" always;

    # A console route carries a job id in its path, so neither a crawler nor an outbound referrer may take it
    # anywhere (retention-and-pseudonymisation design.md RP-5). `add_header` is REPLACE, not merge: a location
    # with any add_header of its own drops every inherited one, which is why /assets/ below repeats all three.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    # An unrouted path answers 404 carrying the console's own not-found page — never the shell with a 200,
    # which is indistinguishable from a working page to anything probing this origin.
    error_page 404 =404 /index.html;

    # The console's routes, rendered from its route tree at build time by clients/web/spa-routes.ts. nginx
    # refuses to start when it is missing, which is the intended failure.
    include /etc/nginx/scvs/spa-routes.conf;

    # `^~` so no generated regex location can take a request for a hashed asset. Vite emits content-hashed
    # filenames, so these are safe to cache indefinitely.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated, not inherited — see the server-level block.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Real files only. A path that is neither a file nor a route above is not this origin's to answer.
    location / {
        try_files $uri =404;
    }

    # Load-balancer health check target. Static, so "the process is up" is the whole of its health — and it
    # does not depend on the console's route tree, which the previous target `/` did.
    location = /healthz {
        access_log off;
        # `default_type`, not `add_header Content-Type`: the latter appends, so the response carried both
        # application/octet-stream and text/plain.
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
