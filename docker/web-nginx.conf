server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Server-level because try_files serves a file without re-matching a location; /assets/ overrides it.
    add_header Cache-Control "no-cache" always;

    # `add_header` does not merge: a location with its own add_header drops every inherited one.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    error_page 404 =404 /index.html;

    include /etc/nginx/scvs/spa-routes.conf;

    # `^~` so no generated regex location can take a request for a hashed asset.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # A relative Location: behind a TLS-terminating balancer an absolute one would name http://.
    location = /docs {
        absolute_redirect off;
        return 301 /docs/;
    }

    # The trailing slash keeps /docs-json and its kin on the console's 404.
    location ^~ /docs/ {
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /docs/404.html;
    }

    location ^~ /docs/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        # `default_type`, not `add_header Content-Type`, which appends a second Content-Type.
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
