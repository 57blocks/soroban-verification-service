name: scvs-full-stack

x-service-image: &service-image
  build:
    context: ..
    dockerfile: docker/service.Dockerfile
  restart: unless-stopped

x-shared-env: &shared-env
  NODE_ENV: production
  AWS_REGION: ${AWS_REGION:-ap-southeast-2}
  SCVS_DRAIN_GRACE_MS: "0"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: scvs
  POSTGRES_USER: scvs
  POSTGRES_PASSWORD: scvs_local_dev

x-result-storage: &result-storage
  SCVS_PUBLISHER_STORAGE: filesystem
  SCVS_RESULT_ROOT: /var/lib/scvs/results
  SCVS_PUBLIC_RESULT_ROOT: http://localhost:5001/public

services:
  postgres:
    container_name: scvs-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scvs
      POSTGRES_PASSWORD: scvs_local_dev
      POSTGRES_DB: scvs
    ports:
      - "5433:5432"
    volumes:
      - scvs_postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scvs -d scvs"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *service-image
    container_name: scvs-migrate
    restart: "no"
    environment:
      <<: *shared-env
    command: ["sh", "-c", "pnpm --filter @scvs/db run prisma:deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  verification-svc:
    <<: *service-image
    container_name: scvs-verification-svc
    environment:
      <<: [*shared-env, *result-storage]
      SERVICE_ENTRYPOINT: verification-svc
      PORT: "5000"
      CORS_ORIGIN: "http://localhost:8080"
      SCVS_STORAGE_BUCKET: ${SCVS_STORAGE_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SCVS_ABUSE_FINGERPRINT_KEY: ${SCVS_ABUSE_FINGERPRINT_KEY:-local-compose-not-a-secret}
      SCVS_LEGAL_DOCUMENTS_SOURCE: ${SCVS_LEGAL_DOCUMENTS_SOURCE:-config/legal-documents.example.json}
    ports:
      - "5000:5000"
    volumes:
      - scvs_results:/var/lib/scvs/results
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  orchestrator-svc:
    <<: *service-image
    container_name: scvs-orchestrator-svc
    environment:
      <<: [*shared-env, *result-storage]
      SERVICE_ENTRYPOINT: orchestrator-svc
      PORT: "5002"
      SCVS_BATCH_JOB_QUEUE_ARN_ARM64: ${SCVS_BATCH_JOB_QUEUE_ARN_ARM64:-}
      SCVS_BATCH_JOB_QUEUE_ARN_AMD64: ${SCVS_BATCH_JOB_QUEUE_ARN_AMD64:-}
      SCVS_BATCH_DEFAULT_ARCH: ${SCVS_BATCH_DEFAULT_ARCH:-arm64}
      SCVS_BATCH_JOB_DEFINITION_ARN_ARM64: ${SCVS_BATCH_JOB_DEFINITION_ARN_ARM64:-}
      SCVS_BATCH_JOB_DEFINITION_ARN_AMD64: ${SCVS_BATCH_JOB_DEFINITION_ARN_AMD64:-}
      SCVS_JOB_STATE_CHANGE_QUEUE_URL: ${SCVS_JOB_STATE_CHANGE_QUEUE_URL:-}
      SCVS_STORAGE_BUCKET: ${SCVS_STORAGE_BUCKET:-}
      SCVS_VERIFIER_ID: ${SCVS_VERIFIER_ID:-local-verifier}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - scvs_results:/var/lib/scvs/results
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  query-svc:
    <<: *service-image
    container_name: scvs-query-svc
    environment:
      <<: [*shared-env, *result-storage]
      SERVICE_ENTRYPOINT: query-svc
      PORT: "5001"
      CORS_ORIGIN: "http://localhost:8080"
    ports:
      - "5001:5001"
    # Read-only: this service must never write the result tree.
    volumes:
      - scvs_results:/var/lib/scvs/results:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    container_name: scvs-web
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        VITE_VERIFY_API_URL: ${VITE_VERIFY_API_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      verification-svc:
        condition: service_started

volumes:
  scvs_postgres_data:
  scvs_results:
