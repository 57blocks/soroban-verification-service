        eng-tools/composition-pairs.mjs's oldest-major-cli23.3.0-rust1.91.1 row composed on 2026-08-19,
        so the environment exists and the toolchain compiles a contract in it.
      - >-
        ★ ANSWERED 2026-08-19. The stated risk was that the committed Cargo.lock pins soroban-sdk 25.3.1
        and that SDK's MSRV might be above 1.91.1, in which case no fixture could exist on this rsver. It
        is not: the build succeeded and the deployed metadata records rssdkver 25.3.1#e50d95af — the same
        SDK every other fixture resolved. 1.91.1 is inside its MSRV.
      - >-
        ★ And a second thing that answers, which was the more interesting worry. 23.3.0 has no --locked
        (nothing before 25.2.0 does), so this build ran without it — and cargo still resolved exactly
        rssdkver 25.3.1#e50d95af, byte-identical to the --locked builds. That is direct evidence for the
        claim in build-purpose-contracts.sh that a committed Cargo.lock is sufficient for a fixed source
        tree and that dropping --locked does not weaken these fixtures. It is one observation, not a
        proof — cargo may still re-resolve if the manifest ever loosens — but it is the observation the
        claim was missing.

