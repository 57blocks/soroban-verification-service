      - >-
        the lowest rsver any fixture carries, and the only one below 1.94 — 27.0.0/1.96.0 was the newest
        end of both ranges and the only end the E2E layer had
      - 626 bytes, and a wasm_hash distinct from every other compose fixture and from F-LEG-1
    build:
      image: composed locally — scvs-composed:template-gate-v3
      produce: >-
        node eng-tools/check-composition-template.mjs --cliver '23.3.0#08473ac20016c369067ce0dbca91d9595e72d6d4'
        --rsver 1.91.1 --keep-image --no-contract-build
