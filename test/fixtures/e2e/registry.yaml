      - deployed metadata records cliver 25.1.0#a048a57a and rsver 1.95.0 and no bldimg
      - >-
        626 bytes and rssdkver 25.3.1#e50d95af — identical to purpose_testnet_f_leg_1's on both counts,
        so neither the source nor the SDK is a variable and the pair is the only difference between them
      - >-
        wasm_hash differs from F-LEG-1's, from purpose_testnet_f_compose_only's and from
        purpose_testnet_f_old_end's, so no two compose fixtures were built in the same image
    build:
      image: composed locally — scvs-composed:template-gate-v3
      produce: >-
        node eng-tools/check-composition-template.mjs --cliver '25.1.0#a048a57a75762458b487052e0021ea704a926bee'
        --rsver 1.95.0 --keep-image --no-contract-build
      build_command: >-
        SCVS_FIXTURE_BUILD_SCOPE=compose-only SCVS_FIXTURE_COMPOSE_TARGET=F-DEMAND-01
        SCVS_FIXTURE_BUILD_IMAGE=scvs-composed:template-gate-v3
        bash test/fixtures/e2e/build-purpose-contracts.sh
      deploy_command: SCVS_FIXTURE_DEPLOY_SET=compose-only bash test/fixtures/e2e/deploy-testnet.sh
    notes:
      - >-
        Composition already proved this pair can be materialized — eng-tools/composition-pairs.mjs's
        demand-01 row composed on 2026-08-19. What is untested is whether a submission on it reaches a
        verdict, which is decided three files away in verification-pipeline.service.ts.
      - >-
        Same source, same guards and the same stated limit as purpose_testnet_f_compose_only: built by
        our composer and verified by our composer, so it proves the pipeline and the composition's
        reproducibility, not agreement with a third party's 25.1.0/1.95.0 (there is none).
      - >-
        The composition gate reuses one image tag for every pair, so building this target without first
        recomposing for its pair would build it in whichever pair's image is still tagged. The metadata
        read-back in build-purpose-contracts.sh refuses that, and so does the duplicate-hash check
        against every sibling in the compose_targets table.

