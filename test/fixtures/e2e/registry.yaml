    status: candidate
    candidates:
      - public_testnet_stellaroid_earn
      - public_testnet_stellaroid_2026_reference
      - public_testnet_smart_block_explorer
    purpose: supplemental real public testnet corpus, separate from purpose-built deterministic fixtures
    need:
