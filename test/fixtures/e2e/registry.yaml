    status: ready
    contract: existing_mainnet_reflector_pulse_v6_0_1
    evidence: test/fixtures/e2e/validate-mainnet-reflector-rebuild.sh
  F-LEG-2:
    status: candidate
    candidates: [existing_mainnet_reflector_pulse_v6_0_1, existing_testnet_cli_legacy_27_1_94_1]
    need: reproducible verifier-composed image and digest for at least one candidate
    not_blocking: E2E-SUB-02/compose_cache_hit — implemented 2026-08-20 on F-LEG-1 + F-MULTIPKG
    still_blocking: E2E-PUB-15's queued row, and the cross-environment claim described above
  F-COMPOSE-ONLY:
    status: ready
    contract: purpose_testnet_f_compose_only
    purpose: prove the E2E pipeline reaches a verdict for a pair no official image exists for
    relation_to_F-LEG-2: >-
      F-LEG-2 wants "a reproducible verifier-composed image and digest" for a contract already on
      chain. This is the purpose-built way to get the same property without waiting for a suitable
      third-party contract to appear, so it can carry E2E-SUB-02's cache-reuse claim for its own pair.
      It does not close F-LEG-2, which is about an *existing* contract.
  F-DEMAND-01:
    status: ready
    contract: purpose_testnet_f_demand_01
    purpose: carry the corpus's largest single combination (25.2% of live class-B) end to end
  F-OLD-END:
    status: ready
    contract: purpose_testnet_f_old_end
    purpose: the only E2E fixture at the old end of both version ranges (23.x CLI, rust below 1.94)
    measured: >-
      the pinned soroban-sdk 25.3.1 accepts rust 1.91.1 — the MSRV risk this entry warned about did not
      materialise, and the build resolved the same SDK without --locked. See the contract entry's ★ notes.
  F-FLOOR-REFUSE:
    status: ready
    contract: existing_testnet_refusable_cliver
    purpose: >-
      prove a toolchain the composer must refuse is refused with the permanent arm (policy_rejected),
      not the retryable one
    found: >-
      2026-08-19 — CDZZY4MN…U32JZR, cliver "25.2.0#" (empty rev) → unaddressable_cliver. Discovered by
      test/fixtures/e2e/find-refusable-contracts.mjs --scan in a 20-contract sample.
    not_blocked_on: >-
      rebuild evidence. Unlike F-PUBTEST, this fixture's expected verdict is reached before any build,
      so no source has to reproduce the deployed bytes and nothing is published.
