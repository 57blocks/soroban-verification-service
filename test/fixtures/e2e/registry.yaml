  purpose_testnet_f_compose_only:
    fixture_roles: [F-COMPOSE-ONLY]
    network: testnet
    contract_id: CB6BPRLONPH3SX4YBR5IPQOOXQNYZ7BPXDUSV4BL2RHH2ZDBWJMT6UNE
    wasm_hash: b052d489ff3acc03cb2efc56292b24ff0cb119d71b831d5c3d36d17a97c021b4
    class: cli-legacy
    cliver: 25.2.0#28484880988199233a7e8e87c97cb12dac323cb3
    rsver: 1.94.0
    bldopt: [--locked, --manifest-path=contracts/verified-demo/Cargo.toml, --package=verified-demo, --optimize]
    source_sha256: ecf4bc7db300358330af9bc1a272267f1c870a849b68db0f768bcea4b6078533
    status: ready
    purpose: >-
      The first fixture on a pair Docker Hub publishes no image for. Docker Hub carries six
      (cliver, rsver) pairs; the 2026-07-30 corpus scan found 99 live pairs, so 92.6% of live
      class-B contracts can only ever be verified through composition, and until this fixture
      existed no E2E case had driven the full pipeline for one of them. Demand rank 2 (10.1%).
      Superseded as the *most important* of its kind by purpose_testnet_f_demand_01 — this pair
      was chosen because a specific public contract raised the question, not because of demand.
    validation:
      - >-
        built 2026-08-19 inside scvs-composed:template-gate-v3, a locally composed image for this pair;
        no such image exists on Docker Hub, which is the fixture's whole premise
      - >-
        deployed to testnet and fetched back with matching Wasm hash; the metadata below is read from the
        fetched bytes, not from the image that claimed to produce them
      - >-
        deployed metadata records cliver 25.2.0#28484880 and rsver 1.94.0 and no bldimg, so the chain
        classifies it cli-legacy and the verifier must compose
      - >-
        rssdkver 25.3.1#e50d95af matches purpose_testnet_f_leg_1's, so `--locked` held and the SDK is not
        a second variable between the two fixtures
      - >-
        626 bytes, byte-for-byte the same length as f-leg-1-official.wasm from the same source, and a
        different hash (b052d489 vs 34fc22d0)
    build:
      image: composed locally — scvs-composed:template-gate-v3
      produce: >-
        node eng-tools/check-composition-template.mjs --cliver '25.2.0#28484880988199233a7e8e87c97cb12dac323cb3'
        --rsver 1.94.0 --keep-image --no-contract-build
      build_command: >-
        SCVS_FIXTURE_BUILD_SCOPE=compose-only SCVS_FIXTURE_BUILD_IMAGE=scvs-composed:template-gate-v3
        bash test/fixtures/e2e/build-purpose-contracts.sh
      deploy_command: SCVS_FIXTURE_DEPLOY_SET=compose-only bash test/fixtures/e2e/deploy-testnet.sh
    notes:
      - >-
        Source is byte-identical to purpose_testnet_f_leg_1's, which is what makes the pair the only
        variable between the two fixtures and lets this entry reuse that source_sha256.
      - >-
        Built by our composer and verified by our composer. That proves the pipeline runs end to end
        for an unofficial pair and that the composition is reproducible; it does not prove our
        composed 25.2.0/1.94.0 agrees with a third party's, because no official 25.2.0/1.94.0 exists
        to agree with. purpose_testnet_f_leg_1 carries the cross-environment half — official image in,
        composed image out — and neither fixture substitutes for the other.
      - >-
        build-purpose-contracts.sh reads cliver and rsver back out of the built Wasm and refuses a
        mismatch, and refuses bytes identical to f-leg-1-official.wasm, so a run pointed at the wrong
        image cannot quietly produce a fixture that covers the pair it was meant to be different from.
      - >-
        Of those two guards the metadata read-back is the load-bearing one, and the 2026-08-19 build
        showed why: this Wasm and f-leg-1-official.wasm are both 626 bytes and carry the same rssdkver,
        so the whole hash difference may be nothing but the cliver string embedded in contractmetav0.
        The duplicate-hash check would therefore be satisfied by a metadata change alone and cannot on
        its own establish that a different toolchain ran. That is fine for what this fixture claims —
        it is about the pipeline composing and verifying an unpublished pair, not about codegen
        diverging between toolchains — but the two guards are not interchangeable and this one is the
        weaker.

  existing_testnet_refusable_cliver:
    fixture_roles: [F-FLOOR-REFUSE]
    network: testnet
    contract_id: CDZZY4MN4KV73AF43PQ7UF2LASI6COPWMLLT5YVM5RS2LVIJABU32JZR
    wasm_hash: 06186e938a0ba1585a5d8a6d2ec802f3d184aaf9ec298d8c8aece50ca56cb239
    class: cli-legacy
    cliver: "25.2.0#"
    rsver: 1.94.0
    expected_composition_reason: unaddressable_cliver
    expected_verdict: policy_rejected
    status: ready
    purpose: >-
      Prove end to end that a recorded toolchain the composer must permanently refuse is refused with
      the permanent arm — job status policy_rejected — and not with the retryable one, which would tell
      the submitter of a contract that can never be built to retry forever. The composition matrix
      proves the shape of the refusal at the composer; the arm is chosen three files away, in
      verification-pipeline.service.ts.
    found: >-
      2026-08-19, by test/fixtures/e2e/find-refusable-contracts.mjs --scan, in a 20-contract sample.
      Its cliver is "25.2.0#" — a trailing separator with an empty rev. parseCliver requires at least
      one character after the '#' (REV_RE), so it returns undefined and components.ts refuses with
      unaddressable_cliver before any download. classifyBuildEnvironment still routes it to compose,
      because the pair is present and not an undated nightly — which is what makes it this case rather
      than a preflight one.
    validation:
      - fetched from testnet 2026-08-19; wasm_hash above is the sha256 of the fetched bytes
      - metadata parsed locally by `stellar contract info meta`, not read from an explorer's cache
      - >-
        classifyBuildEnvironment routes it to `compose` — the pair is present and not an undated
        nightly — so preflight cannot refuse it and the refusal must come from the composer
      - >-
        parseCliver refuses "25.2.0#" (REV_RE needs at least one character after the '#'), so
        components.ts raises unaddressable_cliver before any component is downloaded
      - unaddressable_cliver is in PERMANENT_COMPOSITION_FAILURES, so the job must end policy_rejected
      - no rebuild evidence needed: the verdict is reached before any source is fetched or compiled
    standing_caution: >-
      ★ Somebody else's contract on testnet, which is a weaker guarantee than a purpose-built fixture —
      testnet is periodically reset. Re-confirm it is live if the case starts failing at preflight; if it
      is gone, re-run test/fixtures/e2e/find-refusable-contracts.mjs. Nothing about the case is specific
      to this contract, and it accepts either refusal family.
    requirements:
      - records a cliver and an rsver and no bldimg, so classification routes it to compose
      - one of those two values is a permanent composition refusal
      - not an undated nightly and not a missing pair — those are refused at preflight, a different case
    notes:
      - >-
        ★ NOT blocked on rebuild evidence, and that is why this fixture is reachable while F-PUBTEST is
        not. The expected verdict is reached before any source is fetched, compiled or compared, and
        nothing is published, so no source has to reproduce the deployed bytes. The submission carries an
        archive because the API requires one; it is never opened. F-LEG-1's source_uri/source_sha256 are
        fine for it.
      - >-
        Two refusal families are acceptable here and the E2E case derives which one applies from what the
        chain records, so replacing this contract with one carrying the other defect needs no code change:
        unaddressable_cliver (this one) and toolchain_target_unavailable (an rsver below 1.84.0, the
        release wasm32v1-none shipped in — of the 20 stable rsvers the corpus records, only 1.81.0).
      - >-
        Not purpose-buildable, for either family: the CLI stamps both fields itself. A real binary does
        not write "25.2.0#", and a toolchain lacking wasm32v1-none cannot complete the build the CLI
        requests. That is exactly why these pairs are refusable.
      - >-
        ★ The discovery script walked past this contract on its first run. Its own copy of the cliver
        shape rules tested `cliver.includes("#")` for a missing rev, which an empty rev satisfies, so it
        reported "rsver 1.94.0 is servable" — true, and beside the point. It now imports parseCliver and
        classifyBuildEnvironment from @scvs/core's built output, so a disagreement between the script and
        the service is no longer expressible.

