version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: disabled
    cooldown:
      default-days: 3
    groups:
      # Dependabot ranks a dependency-type group above a patterns group, so the risk classes must exclude these.
      nestjs:
        patterns: ["@nestjs/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      eslint:
        patterns: ["eslint", "@eslint/js"]
      production-patch-and-minor:
        dependency-type: production
        update-types: ["minor", "patch"]
        exclude-patterns: ["@nestjs/*", "vitest", "@vitest/*", "eslint", "@eslint/js"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
        exclude-patterns: ["@nestjs/*", "vitest", "@vitest/*", "eslint", "@eslint/js"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # tailwind-merge 3 only knows Tailwind 4 class names; it moves with the tailwindcss major.
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    cooldown:
      default-days: 3
    ignore:
      # Odd nginx minors are mainline; stay on the stable (even) lines.
      - dependency-name: nginx
        versions: ["~> 1.31.0", "~> 1.33.0", "~> 1.35.0"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
