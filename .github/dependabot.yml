# Actions are pinned to commit SHAs, which is what stops a moved tag from changing what a workflow
# runs — and what stops a security fix from arriving on its own. This file is the other half of that
# trade: without it a pinned SHA is a frozen SHA.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    # GitHub's default made explicit: a release is not proposed until it is 3 days old.
    cooldown:
      default-days: 3
    groups:
      # Majors stay out, so each one arrives as its own pull request.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The lockfile is fully registry.npmjs.org, so these resolve for anyone — including a fork.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    # Every pull request here rewrites the one pnpm-lock.yaml, so each lockfile merge would rebase and re-run CI
    # on all of them. Ask with `@dependabot rebase` just before merging instead.
    rebase-strategy: disabled
    # A hand-written bump bypasses this: keep its floors at releases at least 3 days old too.
    cooldown:
      default-days: 3
    groups:
      # Packages that peer on each other's exact major, so one moved alone breaks the build. A dependency
      # joins the first group it matches, so these sit above the risk classes below.
      nestjs:
        patterns: ["@nestjs/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      eslint:
        patterns: ["eslint", "@eslint/js"]
      # One pull request per risk class rather than per package: a patch bump nobody reads is noise,
      # and a major that arrives inside a group of thirty is a major nobody reviewed.
      production-patch-and-minor:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Types track the runtime's Node major, which moves by hand with the pins listed under `docker` below.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The base images the sandbox and the services are built from. A stale base image is the most
  # common way a fixed CVE stays unfixed.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    # A floating tag's age is its last push, so a re-pushed maintained line can wait a week; the nginx
    # ignore below is what stops the wait from picking a dead line instead.
    cooldown:
      default-days: 3
    ignore:
      # nginx's even minors are stable and its odd minors are mainline; we stay on stable.
      - dependency-name: nginx
        versions: ["~> 1.31.0", "~> 1.33.0", "~> 1.35.0"]
      # We track Node's LTS line, and a major bump leaves it: 24 is Active LTS until 2026-10-20,
      # while 26 released 2026-05-05 and is Current — it does not become LTS until **2026-10-28**.
      #
      # This is a deferral with a date, not a standing refusal. Take the bump after 2026-10-28, when
      # 26 is LTS and 24 has just gone to maintenance, and move all five pins in the same change:
      # `.nvmrc`, `node-version` in `ci.yml`, the nine `FROM node:` lines under `docker/`,
      # `clients/sdk/package.json`'s `engines`, and every `@types/node`. Bumping only the images —
      # which is all Dependabot can do here — would leave CI testing on one major while the
      # containers run another.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
