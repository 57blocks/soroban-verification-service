# Actions are pinned to commit SHAs, which is what stops a moved tag from changing what a workflow
# runs — and what stops a security fix from arriving on its own. This file is the other half of that
# trade: without it a pinned SHA is a frozen SHA.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns: ["*"]

  # The lockfile is fully registry.npmjs.org, so these resolve for anyone — including a fork.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One pull request per risk class rather than per package: a patch bump nobody reads is noise,
      # and a major that arrives inside a group of thirty is a major nobody reviewed.
      production-patch-and-minor:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]

  # The base images the sandbox and the services are built from. A stale base image is the most
  # common way a fixed CVE stays unfixed.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # We track Node's LTS line, and a major bump leaves it: 24 is Active LTS until 2026-10-20,
      # while 26 released 2026-05-05 and is Current — it does not become LTS until **2026-10-28**.
      #
      # This is a deferral with a date, not a standing refusal. Take the bump after 2026-10-28, when
      # 26 is LTS and 24 has just gone to maintenance, and move all four pins in the same change:
      # `.nvmrc`, `node-version` in `ci.yml`, the nine `FROM node:` lines under `docker/`, and
      # `clients/sdk/package.json`'s `engines`. Bumping only the images — which is all Dependabot
      # can do here — would leave CI testing on one major while the containers run another.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
