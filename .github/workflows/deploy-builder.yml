name: Build & deploy builder image

run-name: ${{ github.event_name == 'workflow_dispatch' && 'Build & deploy builder image → dev + staging (contract-gated)' || '' }}

on:
  workflow_call:
    inputs:
      source_repository:
        description: >-
          Where the application source lives. Defaults to this project; a fork running its own
          deployment passes its own. Only ever read, and the repository is public, so no token.
        type: string
        required: false
        default: 57blocks/soroban-verification-service
      source_sha:
        description: >-
          The application commit whose published image to deploy. This workflow builds nothing: the
          image already exists, pushed by publish-images.yml, and is addressed by this commit.
        type: string
        required: true
    secrets:
      AWS_ACCOUNT_ID:
        description: >-
          The deploy-role fallback's account id. An identifier, not a credential — it is a secret
          only so it stays out of the tree, and the caller passes it explicitly.
        required: false
      SOURCE_APP_ID:
        description: >-
          GitHub App that may read `source_repository`. Needed only when that repository is private: a
          caller's own token is scoped to the caller. This project's is public, so the checkouts below
          can read it with the caller's token alone.
        required: false
      SOURCE_APP_PRIVATE_KEY:
        description: "That App's private key."
        required: false

permissions:
  id-token: write
  contents: read
  # A called workflow's `permissions:` is a ceiling, not an addition; the caller must grant this too.
  packages: read

# Registrations into the account-wide job-definition families must not interleave.
concurrency:
  group: builder-job-definition
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    environment: dev
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@987eedf6794893c97bf4c85ad8c9dfc3ee0cf618
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - name: Fetch the deployment's contracts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-contracts
          path: /tmp/deploy-contracts

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      # `--sha` is required: under workflow_call the ambient commit is the caller's.
      - name: Fetch main to prove the ref against
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Refuse a ref that is not on main
        env:
          TARGET_ENV: "builder"
          TARGET_SHA: ${{ inputs.source_sha }}
        run: node eng-tools/assert-deploy-ref.mjs --env "$TARGET_ENV" --sha "$TARGET_SHA"

      - name: Check every bind mount is host-visible at an identical path
        run: node eng-tools/check-mount-paths.mjs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Read every environment's CI descriptor
        id: descriptor
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          ARM64_TAGS=()
          AMD64_TAGS=()
          for ENV in dev staging; do
            DESC=$(bash scripts/ci/load-ci-descriptor.sh "$ENV" 2,3)
            echo "$DESC" > "/tmp/ci-descriptor.${ENV}.json"
            REPO=$(jq -r '.ecr.builder // "null"' <<<"$DESC")
            if [ "$REPO" = "null" ] || [ -z "$REPO" ]; then
              echo "::error::$ENV's CI descriptor names no builder ECR repository"
              exit 1
            fi
            ARM64_TAGS+=("${REGISTRY}/${REPO}:${{ inputs.source_sha }}-arm64")
            AMD64_TAGS+=("${REGISTRY}/${REPO}:${{ inputs.source_sha }}-amd64")
          done
          {
            echo "arm64_tags<<TAGS"
            printf '%s\n' "${ARM64_TAGS[@]}"
            echo "TAGS"
            echo "amd64_tags<<TAGS"
            printf '%s\n' "${AMD64_TAGS[@]}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the published builder images into the deployment registry
        id: stage
        env:
          SOURCE_IMAGE: ghcr.io/${{ github.repository_owner }}/sv-builder
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARM64_TAGS: ${{ steps.descriptor.outputs.arm64_tags }}
          AMD64_TAGS: ${{ steps.descriptor.outputs.amd64_tags }}
        run: |
          set -euo pipefail
          copy_arch() {
            local arch="$1" tags="$2"
            local digest
            digest=$(docker buildx imagetools inspect "${SOURCE_IMAGE}:${SOURCE_SHA}-${arch}" \
              --format '{{ .Manifest.Digest }}')
            [ -n "$digest" ] || { echo "::error::no published image at ${SOURCE_IMAGE}:${SOURCE_SHA}-${arch}"; exit 1; }
            echo "${arch}: ${SOURCE_IMAGE}@${digest}"
            echo "${arch}_digest=${digest}" >> "$GITHUB_OUTPUT"
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              docker buildx imagetools create --tag "$tag" "${SOURCE_IMAGE}@${digest}"
            done <<< "$tags"
          }
          copy_arch arm64 "$ARM64_TAGS"
          copy_arch amd64 "$AMD64_TAGS"

      - name: Register new Batch job definition revisions
        id: register
        env:
          BUILDER_VCPU: "1"
          BUILDER_MEMORY_MIB: "1700"
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          declare -A DIGEST_FOR_ARCH=(
            [arm64]="${{ steps.stage.outputs.arm64_digest }}"
            [amd64]="${{ steps.stage.outputs.amd64_digest }}"
          )
          CONTRACT_VERSION=$(bash scripts/ci/read-contract-version.sh)
          CONTRACT_MAJOR="${CONTRACT_VERSION%%.*}"
          echo "this image writes recipe.json contract $CONTRACT_VERSION"
          SKIPPED=()
          REGISTERED=()
          for ENV in dev staging; do
            DESC=$(cat "/tmp/ci-descriptor.${ENV}.json")
            SUPPORTED=$(bash scripts/ci/orchestrator-contract-version.sh read "$ENV")
            if [ "$SUPPORTED" = "none" ]; then
              SKIPPED+=("$ENV — no orchestrator rollout has recorded a contract version yet")
              continue
            fi
            # Only MAJOR gates: a higher MINOR is additive, a higher MAJOR is unreadable.
            if [ "$CONTRACT_MAJOR" -gt "${SUPPORTED%%.*}" ]; then
              SKIPPED+=("$ENV — orchestrator supports $SUPPORTED, this image writes $CONTRACT_VERSION")
              continue
            fi
            REGISTRY_REPO="${REGISTRY}/$(jq -r '.ecr.builder' <<<"$DESC")"
            declare -A IMAGE_FOR_ARCH=(
              [arm64]="${REGISTRY_REPO}@${DIGEST_FOR_ARCH[arm64]}"
              [amd64]="${REGISTRY_REPO}@${DIGEST_FOR_ARCH[amd64]}"
            )
            declare -A FAMILY_FOR_ARCH=(
              [arm64]="$(jq -r '.batch.builder_job_definition_arm64 // "null"' <<<"$DESC")"
              [amd64]="$(jq -r '.batch.builder_job_definition_amd64 // "null"' <<<"$DESC")"
            )
            for ARCH in arm64 amd64; do
              FAMILY="${FAMILY_FOR_ARCH[$ARCH]}"
              IMAGE="${IMAGE_FOR_ARCH[$ARCH]}"
              if [ -z "$FAMILY" ] || [ "$FAMILY" = "null" ]; then
                echo "::error::$ENV's CI descriptor names no ${ARCH} builder job-definition family." \
                     "Apply your infrastructure (batch_builder_job_definition_name_amd64 +" \
                     "ci_descriptor schema_version 2) to $ENV before deploying the builder."
                exit 1
              fi
              ECS_PROPERTIES="{
                  \"taskProperties\": [{
                    \"volumes\": [
                      {\"name\": \"docker-sock\", \"host\": {\"sourcePath\": \"/var/run/docker.sock\"}},
                      {\"name\": \"scvs-shared\", \"host\": {\"sourcePath\": \"/tmp\"}}
                    ],
                    \"containers\": [
                      {
                        \"name\": \"materialise\",
                        \"image\": \"${IMAGE}\",
                        \"command\": [\"node\", \"services/builder/dist/materialise-entrypoint.js\"],
                        \"essential\": false,
                        \"resourceRequirements\": [
                          {\"type\": \"VCPU\", \"value\": \"${BUILDER_VCPU}\"},
                          {\"type\": \"MEMORY\", \"value\": \"${BUILDER_MEMORY_MIB}\"}
                        ],
                        \"environment\": [
                          {\"name\": \"SCVS_HANDOFF_ROOT\", \"value\": \"/tmp\"}
                        ],
                        \"mountPoints\": [
                          {\"sourceVolume\": \"scvs-shared\", \"containerPath\": \"/tmp\", \"readOnly\": false}
                        ]
                      },
                      {
                        \"name\": \"runner\",
                        \"image\": \"${IMAGE}\",
                        \"command\": [\"node\", \"services/builder/dist/entrypoint.js\"],
                        \"essential\": true,
                        \"dependsOn\": [{\"containerName\": \"materialise\", \"condition\": \"SUCCESS\"}],
                        \"resourceRequirements\": [
                          {\"type\": \"VCPU\", \"value\": \"${BUILDER_VCPU}\"},
                          {\"type\": \"MEMORY\", \"value\": \"${BUILDER_MEMORY_MIB}\"}
                        ],
                        \"environment\": [
                          {\"name\": \"SCVS_HANDOFF_ROOT\", \"value\": \"/tmp\"}
                        ],
                        \"mountPoints\": [
                          {\"sourceVolume\": \"docker-sock\", \"containerPath\": \"/var/run/docker.sock\", \"readOnly\": false},
                          {\"sourceVolume\": \"scvs-shared\", \"containerPath\": \"/tmp\", \"readOnly\": false}
                        ]
                      }
                    ]
                  }]
                }"

              # Must run before register: a non-zero exit means the definition crosses the sandbox trust boundary.
              jq -n --argjson p "$ECS_PROPERTIES" \
                '{jobDefinitionName: "x", type: "container", ecsProperties: $p}' > /tmp/builder-jobdef.json
              node eng-tools/check-taskdef-boundary.mjs --env "$ENV" --service builder \
                --contract "/tmp/deploy-contracts/$ENV/builder.json" /tmp/builder-jobdef.json

              JOB_DEF_ARN=$(aws batch register-job-definition \
                --job-definition-name "$FAMILY" \
                --type container \
                --platform-capabilities EC2 \
                --region "${{ env.AWS_REGION }}" \
                --ecs-properties "$ECS_PROPERTIES" \
                --tags Project=sv,Environment=$ENV,ManagedBy=github-actions,Purpose=scvs-real-verify-pipeline,CommitSha=${{ inputs.source_sha }},Architecture=$ARCH \
                --query 'jobDefinitionArn' --output text)
              echo "Registered $FAMILY ($ARCH): $JOB_DEF_ARN"
            done
            REGISTERED+=("$ENV at contract $CONTRACT_VERSION (orchestrator supports $SUPPORTED)")
          done

          {
            echo "### Builder image → Batch job definitions"
            echo
            echo "This image writes \`recipe.json\` contract **$CONTRACT_VERSION**."
            echo
            for ENTRY in "${REGISTERED[@]:-}"; do [ -n "$ENTRY" ] && echo "- ✅ registered: $ENTRY"; done
            for ENTRY in "${SKIPPED[@]:-}"; do [ -n "$ENTRY" ] && echo "- ⏭️ **skipped**: $ENTRY"; done
            if [ "${#SKIPPED[@]}" -gt 0 ]; then
              echo
              echo "A skipped environment keeps running its previous builder image, which is safe."
              echo "To move it forward, deploy **that environment's** orchestrator first"
              echo "(\`deploy.yml\` → the environment), then re-run this workflow."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#SKIPPED[@]}" -gt 0 ]; then
            for ENTRY in "${SKIPPED[@]}"; do
              echo "::error::builder not registered into $ENTRY — deploy that environment's orchestrator first"
            done
            exit 1
          fi
