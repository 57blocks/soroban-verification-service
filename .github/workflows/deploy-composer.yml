name: Build & deploy composer image

run-name: ${{ github.event_name == 'workflow_dispatch' && 'Build & deploy composer image → dev + staging' || '' }}

on:
  workflow_call:
    inputs:
      source_repository:
        description: >-
          Where the application source lives. Defaults to this project; a fork running its own
          deployment passes its own. Only ever read, and the repository is public, so no token.
        type: string
        required: false
        default: 57blocks/soroban-verification-service
      source_sha:
        description: >-
          The application commit whose published image to deploy. This workflow builds nothing: the
          image already exists, pushed by publish-images.yml, and is addressed by this commit.
        type: string
        required: true
    secrets:
      AWS_ACCOUNT_ID:
        description: >-
          The deploy-role fallback's account id. An identifier, not a credential — it is a secret
          only so it stays out of the tree, and the caller passes it explicitly.
        required: false
      SOURCE_APP_ID:
        description: >-
          GitHub App that may read this repository, while it is still private. A caller's own token is
          scoped to the caller, so without this the checkouts below cannot see this project's source.
          Both are unnecessary — and should be deleted — once the repository is public.
        required: false
      SOURCE_APP_PRIVATE_KEY:
        description: "That App's private key."
        required: false

permissions:
  id-token: write
  contents: read
  # A called workflow's `permissions:` is a ceiling, not an addition; the caller must grant this too.
  packages: read

# Overlapping runs finishing out of order would leave an older image as the latest ACTIVE revision.
concurrency:
  group: composer-job-definitions
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: dev
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
    outputs:
      # Never a full image reference: the registry hostname embeds the account id, which GitHub strips from outputs.
      image_repo: ${{ steps.descriptor.outputs.ecr_composer }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@491a985c0002a083c7f85091c8fbd39e5ffc4fe6
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      # `--sha` is required: under workflow_call the ambient commit is the caller's.
      - name: Fetch main to prove the ref against
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Refuse a ref that is not on main
        env:
          TARGET_ENV: "composer"
          TARGET_SHA: ${{ inputs.source_sha }}
        run: node eng-tools/assert-deploy-ref.mjs --env "$TARGET_ENV" --sha "$TARGET_SHA"

      - name: Check every bind mount is host-visible at an identical path
        run: node eng-tools/check-mount-paths.mjs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read the CI descriptor (dev)
        id: descriptor
        run: |
          DESC=$(bash scripts/ci/load-ci-descriptor.sh dev 2,3)
          echo "$DESC" > /tmp/ci-descriptor.json
          echo "ecr_composer=$(jq -r '.ecr.composer' <<<"$DESC")" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the published composer image into the deployment registry
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ steps.descriptor.outputs.ecr_composer }}
          SOURCE_IMAGE: ghcr.io/${{ github.repository_owner }}/sv-composer
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_DIGEST=$(docker buildx imagetools inspect "${SOURCE_IMAGE}:${SOURCE_SHA}" \
            --format '{{ .Manifest.Digest }}')
          [ -n "$SOURCE_DIGEST" ] || { echo "::error::no published image at ${SOURCE_IMAGE}:${SOURCE_SHA}"; exit 1; }
          docker buildx imagetools create --tag "${REGISTRY}/${REPO}:${SOURCE_SHA}" "${SOURCE_IMAGE}@${SOURCE_DIGEST}"
          DIGEST=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$SOURCE_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ] || { echo "::error::${REPO}:${SOURCE_SHA} is not in the registry after the copy"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  register:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.environment }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging]
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@491a985c0002a083c7f85091c8fbd39e5ffc4fe6
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      # `--sha` is required: under workflow_call the ambient commit is the caller's.
      - name: Fetch main to prove the ref against
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Refuse a ref that is not on main
        env:
          TARGET_ENV: "composer"
          TARGET_SHA: ${{ inputs.source_sha }}
        run: node eng-tools/assert-deploy-ref.mjs --env "$TARGET_ENV" --sha "$TARGET_SHA"

      - name: Fetch the deployment's contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-contracts
          path: /tmp/deploy-contracts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read the CI descriptor (${{ matrix.environment }})
        id: descriptor
        run: |
          DESC=$(bash scripts/ci/load-ci-descriptor.sh "${{ matrix.environment }}" 2,3)
          echo "$DESC" > /tmp/ci-descriptor.json
          echo "family=$(jq -r '.batch.composer_job_definition' <<<"$DESC")" >> "$GITHUB_OUTPUT"
          echo "composer_role=$(jq -r '.batch.composer_role' <<<"$DESC")" >> "$GITHUB_OUTPUT"
          echo "account_id=$(jq -r '.account_id' <<<"$DESC")" >> "$GITHUB_OUTPUT"

      - name: Resolve the deployment account
        id: account
        run: |
          echo "id=$(aws sts get-caller-identity --query Account --output text --region "$AWS_REGION")" >> "$GITHUB_OUTPUT"

      - name: Register new Batch job definition revision
        env:
          IMAGE: ${{ format('{0}.dkr.ecr.{1}.amazonaws.com/{2}@{3}', steps.account.outputs.id, env.AWS_REGION, needs.build-and-deploy.outputs.image_repo, needs.build-and-deploy.outputs.image_digest) }}
          JOB_DEFINITION_NAME: ${{ steps.descriptor.outputs.family }}
          JOB_ROLE_ARN: arn:aws:iam::${{ steps.descriptor.outputs.account_id }}:role/${{ steps.descriptor.outputs.composer_role }}
        run: |
          set -euo pipefail
          echo "family:   $JOB_DEFINITION_NAME"
          echo "job role: $JOB_ROLE_ARN"
          echo "image:    $IMAGE"

          CONTAINER_PROPERTIES="{
              \"image\": \"${IMAGE}\",
              \"jobRoleArn\": \"${JOB_ROLE_ARN}\",
              \"resourceRequirements\": [
                {\"type\": \"VCPU\", \"value\": \"2\"},
                {\"type\": \"MEMORY\", \"value\": \"3800\"}
              ],
              \"environment\": [],
              \"volumes\": [
                {\"name\": \"docker-sock\", \"host\": {\"sourcePath\": \"/var/run/docker.sock\"}},
                {\"name\": \"host-tmp\", \"host\": {\"sourcePath\": \"/tmp\"}}
              ],
              \"mountPoints\": [
                {\"sourceVolume\": \"docker-sock\", \"containerPath\": \"/var/run/docker.sock\", \"readOnly\": false},
                {\"sourceVolume\": \"host-tmp\", \"containerPath\": \"/tmp\", \"readOnly\": false}
              ]
            }"

          # Must run before register: a non-zero exit means the definition crosses the sandbox trust boundary.
          jq -n --argjson p "$CONTAINER_PROPERTIES" \
            '{jobDefinitionName: "x", type: "container", containerProperties: $p}' > /tmp/composer-jobdef.json
          node eng-tools/check-taskdef-boundary.mjs \
            --env "${{ matrix.environment }}" --service composer \
            --contract "/tmp/deploy-contracts/${{ matrix.environment }}/composer.json" /tmp/composer-jobdef.json

          JOB_DEF_ARN=$(aws batch register-job-definition \
            --job-definition-name "$JOB_DEFINITION_NAME" \
            --type container \
            --platform-capabilities EC2 \
            --region "${{ env.AWS_REGION }}" \
            --container-properties "$CONTAINER_PROPERTIES" \
            --tags Project=sv,Environment=${{ matrix.environment }},ManagedBy=github-actions,Purpose=sv-${{ matrix.environment }}-composed-environments,CommitSha=${{ inputs.source_sha }} \
            --query 'jobDefinitionArn' --output text)
          echo "Registered: $JOB_DEF_ARN"
