name: Deploy to ECS

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy to ECS → {0}', inputs.environment) || '' }}

on:
  workflow_call:
    inputs:
      source_repository:
        description: >-
          Where the application source lives. Defaults to this project; a fork running its own
          deployment passes its own. Only ever read, and the repository is public, so no token.
        type: string
        required: false
        default: 57blocks/soroban-verification-service
      environment:
        description: "Which environment to deploy — dev or staging. Required; there is no default, because a default would silently deploy dev during a staging run."
        type: string
        required: true
      source_sha:
        description: >-
          The application commit whose published images to deploy. This workflow builds nothing: the
          images already exist, pushed by publish-images.yml, and are addressed by this commit.
        type: string
        required: true
      deploy_service:
        description: "Deploy the resident services' image. What changed is the caller's question — this workflow never reads git history, because under `workflow_call` the history it could read is the caller's."
        type: boolean
        required: false
        default: true
      deploy_web:
        description: "Deploy the console image."
        type: boolean
        required: false
        default: true
    secrets:
      AWS_ACCOUNT_ID:
        description: >-
          The deploy-role fallback's account id. An identifier, not a credential — it is a secret
          only so it stays out of the tree, and the caller passes it explicitly.
        required: false
      SOURCE_APP_ID:
        description: >-
          GitHub App that may read `source_repository`. Needed only when that repository is private: a
          caller's own token is scoped to the caller. This project's is public, so the checkouts below
          can read it with the caller's token alone.
        required: false
      SOURCE_APP_PRIVATE_KEY:
        description: "That App's private key."
        required: false

permissions:
  id-token: write
  contents: read
  # A called workflow's `permissions:` is a ceiling, not an addition; the caller must grant this too.
  packages: read

# No `concurrency:`: a called workflow repeating its caller's group deadlocks against it.

env:
  AWS_REGION: ap-southeast-2

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      descriptor: ${{ steps.check.outputs.descriptor }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@8c9481d8fd0a9d2461817d3c6ab616af916773de
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Fetch main to prove the deploy ref against
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      # `--sha` is required: under workflow_call the ambient commit is the caller's.
      - name: Refuse a deploy from a commit that is not on main
        env:
          TARGET_ENV: ${{ inputs.environment || 'dev' }}
          TARGET_SHA: ${{ inputs.source_sha }}
        run: node eng-tools/assert-deploy-ref.mjs --env "$TARGET_ENV" --sha "$TARGET_SHA"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read the CI descriptor (version handshake)
        id: check
        run: |
          set +e
          DESC=$(bash scripts/ci/load-ci-descriptor.sh "${{ inputs.environment || 'dev' }}" 2,3)
          code=$?
          set -e
          case "$code" in
            0)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              # GitHub drops a job output containing a secret's value, and account_id is one.
              echo "descriptor=$(jq -c 'del(.account_id)' <<<"$DESC")" >> "$GITHUB_OUTPUT"
              echo "COMPOSER_JOB_DEFINITION=$(jq -r '.batch.composer_job_definition // empty' <<<"$DESC")" >> "$GITHUB_ENV"
              ;;
            3)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              {
                echo "### Deploy skipped — no CI descriptor for this environment yet"
                echo
                echo "Terraform has not been applied to this environment (no"
                echo "\`/scvs/${{ inputs.environment || 'dev' }}/ci/descriptor\`). Apply"
                echo "your infrastructure first. The image build is skipped too, so nothing is"
                echo "pushed to ECR for a release that cannot land."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              # 4 = AccessDenied, 5 = schema mismatch; the script has named the reason.
              exit 1
              ;;
          esac

      - name: Refuse to deploy services that would outrun the composer
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*CURRENT_COMPOSE_TEMPLATE_VERSION = "\([^"]*\)".*/\1/p' \
            packages/core/src/build-environment.ts | head -1)
          if [ -z "$version" ]; then
            echo "::error::could not read CURRENT_COMPOSE_TEMPLATE_VERSION — this check cannot be skipped silently"
            exit 1
          fi

          refuse() {
            {
              echo "### Deploy refused — the composer cannot serve template \`$version\`"
              echo
              echo "orchestrator-svc built from this commit asks for \`$version\`, but $1."
              echo
              echo "Deploying now would fail **every** cli-legacy verification with"
              echo "\`composition_template_missing\`, and the \`Environment\` rows it writes are terminal."
              echo
              echo "Run **Build & deploy composer image** (\`deploy-composer.yml\`) first, then re-run this."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$2 — run deploy-composer.yml first"
            exit 1
          }

          if [ -z "$COMPOSER_JOB_DEFINITION" ]; then
            echo "::notice::the descriptor names no composer job definition, so this environment runs no composer fleet; nothing to compare against"
            exit 0
          fi

          image=$(aws batch describe-job-definitions --job-definition-name "$COMPOSER_JOB_DEFINITION" \
            --status ACTIVE --region "$AWS_REGION" --output json \
            | jq -r '.jobDefinitions | max_by(.revision) | .containerProperties.image // .ecsProperties.taskProperties[0].containers[0].image // empty')
          if [ -z "$image" ]; then
            refuse "\`$COMPOSER_JOB_DEFINITION\` has no ACTIVE revision" \
              "$COMPOSER_JOB_DEFINITION has no ACTIVE revision"
          fi

          if [[ ! "$image" =~ ^([0-9]{12})\.dkr\.ecr\.([a-z0-9-]+)\.amazonaws\.com/([^@:]+)@(sha256:[0-9a-f]{64})$ ]]; then
            refuse "the latest ACTIVE \`$COMPOSER_JOB_DEFINITION\` revision runs an image that is not an ECR image pinned by digest" \
              "$COMPOSER_JOB_DEFINITION runs $image, not an ECR image pinned by digest"
          fi
          registry=${BASH_REMATCH[1]} region=${BASH_REMATCH[2]} repo=${BASH_REMATCH[3]} digest=${BASH_REMATCH[4]}

          if ! tags=$(aws ecr describe-images --registry-id "$registry" --region "$region" \
            --repository-name "$repo" --image-ids imageDigest="$digest" \
            --query 'imageDetails[0].imageTags' --output json); then
            echo "::error::could not read the tags of $repo@$digest, the image $COMPOSER_JOB_DEFINITION runs; on AccessDenied the deploy role needs ecr:DescribeImages on $repo"
            exit 1
          fi
          commit=$(jq -r '[.[]? | select(test("^[0-9a-f]{40}$"))] | first // empty' <<<"$tags")
          if [ -z "$commit" ]; then
            refuse "the image \`$COMPOSER_JOB_DEFINITION\` runs, \`$repo@$digest\`, carries no commit tag" \
              "$repo@$digest carries no commit tag: $tags"
          fi

          echo "orchestrator requests template : $version"
          echo "composer job definition runs   : $repo@$digest ($COMPOSER_JOB_DEFINITION)"
          echo "that image's commit            : $commit"

          if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
            echo "::error::composer commit $commit is not in this checkout's history, so what it ships cannot be read"
            exit 1
          fi

          if git cat-file -e "$commit:docker/composed-environments/$version/template.json" 2>/dev/null; then
            echo "✓ that image's commit ships template $version"
            exit 0
          fi

          refuse "the image \`$COMPOSER_JOB_DEFINITION\` runs is commit \`$commit\`, whose tree has no \`docker/composed-environments/$version/\`" \
            "composer image $commit does not ship template $version"

  stage-service-image:
    needs: preflight
    if: inputs.deploy_service
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      SERVICE_ECR_REPOSITORY: ${{ fromJSON(needs.preflight.outputs.descriptor).ecr.service }}
      SOURCE_IMAGE: ghcr.io/${{ github.repository_owner }}/sv-service
    outputs:
      # Never a full image reference: the registry hostname embeds the account id, which GitHub strips from outputs.
      image_repo: ${{ env.SERVICE_ECR_REPOSITORY }}
      image_digest: ${{ steps.stage.outputs.digest }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the published image into the deployment registry
        id: stage
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          # Copy by digest, not tag: a tag can move between the read and the copy.
          SOURCE_DIGEST=$(docker buildx imagetools inspect "${SOURCE_IMAGE}:${SOURCE_SHA}" \
            --format '{{ .Manifest.Digest }}')
          if [ -z "$SOURCE_DIGEST" ]; then
            echo "::error::no published image at ${SOURCE_IMAGE}:${SOURCE_SHA} — has publish-images.yml run for that commit?"
            exit 1
          fi
          echo "source: ${SOURCE_IMAGE}@${SOURCE_DIGEST}"

          docker buildx imagetools create \
            --tag "${REGISTRY}/${SERVICE_ECR_REPOSITORY}:${SOURCE_SHA}" \
            "${SOURCE_IMAGE}@${SOURCE_DIGEST}"

          DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE_ECR_REPOSITORY" \
            --image-ids imageTag="$SOURCE_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::the copy reported success but ${SERVICE_ECR_REPOSITORY}:${SOURCE_SHA} is not in the registry"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # Owner/name, not `./`: in a called workflow `./` resolves against the caller's repository.
  # `uses:` cannot be an expression; check:workflow-pins keeps this sha current.
  migrate-database-verification-svc:
    needs: stage-service-image
    uses: 57blocks/soroban-verification-service/.github/workflows/db-migrate.yml@fbe67308833f634f55dafadc6c7207d6de960500
    permissions:
      id-token: write
      contents: read
    with:
      action: deploy
      image_repo: ${{ needs.stage-service-image.outputs.image_repo }}
      image_digest: ${{ needs.stage-service-image.outputs.image_digest }}
      # Must be passed explicitly: `inputs` does not propagate into a called workflow.
      environment: ${{ inputs.environment || 'dev' }}
      target: verification-svc
      source_sha: ${{ inputs.source_sha }}
      source_repository: ${{ inputs.source_repository }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      SOURCE_APP_ID: ${{ secrets.SOURCE_APP_ID }}
      SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}

  migrate-database-query-svc:
    needs: stage-service-image
    uses: 57blocks/soroban-verification-service/.github/workflows/db-migrate.yml@fbe67308833f634f55dafadc6c7207d6de960500
    permissions:
      id-token: write
      contents: read
    with:
      action: deploy
      image_repo: ${{ needs.stage-service-image.outputs.image_repo }}
      image_digest: ${{ needs.stage-service-image.outputs.image_digest }}
      environment: ${{ inputs.environment || 'dev' }}
      target: query-svc
      source_sha: ${{ inputs.source_sha }}
      source_repository: ${{ inputs.source_repository }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      SOURCE_APP_ID: ${{ secrets.SOURCE_APP_ID }}
      SOURCE_APP_PRIVATE_KEY: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}

  promote-service-image:
    needs:
      [
        stage-service-image,
        migrate-database-verification-svc,
        migrate-database-query-svc,
        preflight,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      IMAGE_REPO: ${{ needs.stage-service-image.outputs.image_repo }}
      IMAGE_DIGEST: ${{ needs.stage-service-image.outputs.image_digest }}
    outputs:
      previous_digest: ${{ steps.promote.outputs.previous }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@8c9481d8fd0a9d2461817d3c6ab616af916773de
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Move the :deployed alias onto this build
        id: promote
        run: |
          set -euo pipefail
          PREVIOUS=$(aws ecr describe-images --repository-name "$IMAGE_REPO" \
            --image-ids imageTag=deployed --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)
          [ "$PREVIOUS" = "None" ] && PREVIOUS=""
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          bash scripts/ci/promote-image-alias.sh "$IMAGE_REPO" "$IMAGE_DIGEST"

  # The alias moves before the rollout (it is what gets pulled), so a failed rollout must put it back.
  restore-service-alias:
    needs: [stage-service-image, promote-service-image, deploy-service]
    if: |
      always() && needs.deploy-service.result == 'failure'
      && needs.promote-service-image.outputs.previous_digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@8c9481d8fd0a9d2461817d3c6ab616af916773de
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Put the :deployed alias back
        run: |
          bash scripts/ci/promote-image-alias.sh \
            "${{ needs.stage-service-image.outputs.image_repo }}" \
            "${{ needs.promote-service-image.outputs.previous_digest }}"
          echo "::warning::rollout failed; :deployed restored to ${{ needs.promote-service-image.outputs.previous_digest }}"

  deploy-service:
    needs:
      [
        stage-service-image,
        migrate-database-verification-svc,
        migrate-database-query-svc,
        promote-service-image,
        preflight,
      ]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    environment: ${{ inputs.environment || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        service: [verification-svc, orchestrator-svc, query-svc]
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: ${{ fromJSON(needs.preflight.outputs.descriptor).cluster }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@8c9481d8fd0a9d2461817d3c6ab616af916773de
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies for the render tools
        run: pnpm install --frozen-lockfile

      - name: Fetch the deployment's contracts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-contracts
          path: /tmp/deploy-contracts

      # Through `env:`, never interpolated: a quote in the descriptor would otherwise run as shell.
      - name: Write ${{ matrix.service }}'s configuration to Secrets Manager
        env:
          DESCRIPTOR: ${{ needs.preflight.outputs.descriptor }}
        run: |
          set -euo pipefail
          printf '%s' "$DESCRIPTOR" > /tmp/ci-descriptor.json
          node eng-tools/sync-secrets.mjs \
            --env "${{ inputs.environment || 'dev' }}" \
            --service "${{ matrix.service }}" \
            --contract "/tmp/deploy-contracts/${{ inputs.environment || 'dev' }}/${{ matrix.service }}.json" \
            --descriptor @/tmp/ci-descriptor.json

      - name: Render ${{ matrix.service }}'s task definition
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          case "$ACCOUNT" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "::error::could not resolve the account id (got '$ACCOUNT')"; exit 1 ;;
          esac
          node eng-tools/render-taskdef.mjs \
            --env "${{ inputs.environment || 'dev' }}" \
            --service "${{ matrix.service }}" \
            --contract "/tmp/deploy-contracts/${{ inputs.environment || 'dev' }}/${{ matrix.service }}.json" \
            --image "${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ needs.stage-service-image.outputs.image_repo }}@${{ needs.stage-service-image.outputs.image_digest }}" \
            --descriptor @/tmp/ci-descriptor.json \
            > /tmp/taskdef.json

      # Must run before register: a non-zero exit means the definition crosses the sandbox trust boundary.
      - name: Assert the rendered definition respects the trust boundary
        run: |
          node eng-tools/check-taskdef-boundary.mjs \
            --env "${{ inputs.environment || 'dev' }}" \
            --service "${{ matrix.service }}" \
            --contract "/tmp/deploy-contracts/${{ inputs.environment || 'dev' }}/${{ matrix.service }}.json" \
            /tmp/taskdef.json

      - name: Register the task definition
        id: register
        run: |
          set -euo pipefail
          ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "registered $ARN"

      # The ARN goes through the environment: rollback.yml passes service names positionally.
      - name: Roll ${{ matrix.service }} onto the registered revision
        env:
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.arn }}
        run: |
          bash scripts/ci/roll-service-to-alias.sh \
            "$ECS_CLUSTER" "${{ needs.stage-service-image.outputs.image_digest }}" "${{ matrix.service }}"

  # No `if:`: a matrix with any failed leg must not record the contract version.
  record-contract-version:
    needs: [deploy-service, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@8c9481d8fd0a9d2461817d3c6ab616af916773de
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Record the contract version this environment now supports
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ inputs.environment || 'dev' }}"
          VERSION=$(bash scripts/ci/read-contract-version.sh)
          bash scripts/ci/orchestrator-contract-version.sh write "$ENVIRONMENT" "$VERSION"
          {
            echo "### Build-artifact contract"
            echo
            echo "\`$ENVIRONMENT\` orchestrator-svc now supports \`recipe.json\` contract **$VERSION**."
            echo "\`deploy-builder.yml\` will register a builder image at or below that version into this"
            echo "environment, and skip it above."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-config:
    needs: [deploy-service, preflight]
    if: always() && needs.deploy-service.result != 'skipped'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: ${{ fromJSON(needs.preflight.outputs.descriptor).cluster }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@8c9481d8fd0a9d2461817d3c6ab616af916773de
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies for config-contract assertion
        run: pnpm install --frozen-lockfile

      - name: Fetch the deployment's contracts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-contracts
          path: /tmp/deploy-contracts

      - name: Assert the deployed configuration matches the contract
        env:
          TARGET_ENV: ${{ inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/config-reports

          for SERVICE in verification-svc orchestrator-svc query-svc; do
            TASK_ARN=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$SERVICE" \
              --desired-status RUNNING --region "$AWS_REGION" \
              --query 'taskArns[0]' --output text)
            if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
              echo "::error::$SERVICE has no RUNNING task after a stable deploy"
              exit 1
            fi

            TD=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --region "$AWS_REGION" --query 'tasks[0].taskDefinitionArn' --output text)
            OPTS=$(aws ecs describe-task-definition --task-definition "$TD" --region "$AWS_REGION" \
              --query "taskDefinition.containerDefinitions[?name=='${SERVICE}'].logConfiguration.options | [0]")
            GROUP=$(echo "$OPTS" | jq -r '."awslogs-group" // empty')
            PREFIX=$(echo "$OPTS" | jq -r '."awslogs-stream-prefix" // empty')
            if [ -z "$GROUP" ]; then
              echo "::error::$SERVICE's task definition has no awslogs configuration — cannot read its boot report"
              exit 1
            fi

            STREAM="${PREFIX}/${SERVICE}/${TASK_ARN##*/}"
            LINE=$(aws logs get-log-events --log-group-name "$GROUP" --log-stream-name "$STREAM" \
              --region "$AWS_REGION" --start-from-head --limit 500 \
              --query 'events[].message' --output text \
              | tr '\t' '\n' | grep -F '[config-contract]' | tail -1 || true)

            if [ -z "$LINE" ]; then
              echo "::error::$SERVICE logged no [config-contract] line — the running image predates the config-contract log"
              exit 1
            fi
            echo "${LINE#*\[config-contract\] }" > "/tmp/config-reports/${SERVICE}.json"
          done

          node eng-tools/assert-config-contract.mjs --contracts "/tmp/deploy-contracts/${TARGET_ENV}" /tmp/config-reports/*.json \
            | tee /tmp/config-assert.log
          {
            echo "### Deployed configuration contract"
            echo '```'
            cat /tmp/config-assert.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    needs: preflight
    if: inputs.deploy_web
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      WEB_ECR_REPOSITORY: ${{ fromJSON(needs.preflight.outputs.descriptor).ecr.web }}
      SOURCE_IMAGE: ghcr.io/${{ github.repository_owner }}/sv-web
      ECS_CLUSTER: ${{ fromJSON(needs.preflight.outputs.descriptor).cluster }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@8c9481d8fd0a9d2461817d3c6ab616af916773de
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the published console image into the deployment registry
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_DIGEST=$(docker buildx imagetools inspect "${SOURCE_IMAGE}:${SOURCE_SHA}" \
            --format '{{ .Manifest.Digest }}')
          if [ -z "$SOURCE_DIGEST" ]; then
            echo "::error::no published image at ${SOURCE_IMAGE}:${SOURCE_SHA} — has publish-images.yml run for that commit?"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${REGISTRY}/${WEB_ECR_REPOSITORY}:${SOURCE_SHA}" \
            "${SOURCE_IMAGE}@${SOURCE_DIGEST}"
          DIGEST=$(aws ecr describe-images \
            --repository-name "$WEB_ECR_REPOSITORY" \
            --image-ids imageTag="$SOURCE_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::the copy reported success but ${WEB_ECR_REPOSITORY}:${SOURCE_SHA} is not in the registry"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Move the :deployed alias onto this build
        id: promote-web
        run: |
          set -euo pipefail
          PREVIOUS=$(aws ecr describe-images --repository-name "$WEB_ECR_REPOSITORY" \
            --image-ids imageTag=deployed --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)
          [ "$PREVIOUS" = "None" ] && PREVIOUS=""
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          bash scripts/ci/promote-image-alias.sh "$WEB_ECR_REPOSITORY" "${{ steps.build.outputs.digest }}"

      - name: Fetch the deployment's contracts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-contracts
          path: /tmp/deploy-contracts

      - name: Write web's configuration to Secrets Manager
        env:
          DESCRIPTOR: ${{ needs.preflight.outputs.descriptor }}
        run: |
          set -euo pipefail
          printf '%s' "$DESCRIPTOR" > /tmp/ci-descriptor.json
          node eng-tools/sync-secrets.mjs \
            --env "${{ inputs.environment || 'dev' }}" \
            --service web \
            --contract "/tmp/deploy-contracts/${{ inputs.environment || 'dev' }}/web.json" \
            --descriptor @/tmp/ci-descriptor.json

      - name: Render web's task definition
        run: |
          set -euo pipefail
          node eng-tools/render-taskdef.mjs \
            --env "${{ inputs.environment || 'dev' }}" \
            --service web \
            --contract "/tmp/deploy-contracts/${{ inputs.environment || 'dev' }}/web.json" \
            --image "${{ steps.ecr-login.outputs.registry }}/${WEB_ECR_REPOSITORY}@${{ steps.build.outputs.digest }}" \
            --descriptor @/tmp/ci-descriptor.json \
            > /tmp/taskdef.json

      - name: Assert the rendered definition respects the trust boundary
        run: |
          node eng-tools/check-taskdef-boundary.mjs \
            --env "${{ inputs.environment || 'dev' }}" \
            --service web \
            --contract "/tmp/deploy-contracts/${{ inputs.environment || 'dev' }}/web.json" \
            /tmp/taskdef.json

      - name: Register the task definition
        id: register-web
        run: |
          set -euo pipefail
          ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "registered $ARN"

      - name: Roll web onto the registered revision
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-web.outputs.arn }}
        run: |
          bash scripts/ci/roll-service-to-alias.sh \
            "$ECS_CLUSTER" "${{ steps.build.outputs.digest }}" web

      - name: Restore the :deployed alias after a failed rollout
        if: failure() && steps.promote-web.outcome == 'success' && steps.promote-web.outputs.previous != ''
        run: |
          bash scripts/ci/promote-image-alias.sh \
            "$WEB_ECR_REPOSITORY" "${{ steps.promote-web.outputs.previous }}"
          echo "::warning::rollout failed; :deployed restored to ${{ steps.promote-web.outputs.previous }}"

  verify-host-routing:
    needs: [deploy-service, deploy-web]
    if: always() && (needs.deploy-service.result == 'success' || needs.deploy-web.result == 'success')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'dev' }}
    env:
      HOST_ORIGIN: ${{ vars.SCVS_HOST_ORIGIN }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@8c9481d8fd0a9d2461817d3c6ab616af916773de
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Assert the deployed origin answers the routing contract at every position
        run: |
          node eng-tools/assert-host-routing.mjs \
            --env "${{ inputs.environment || 'dev' }}" --origin "$HOST_ORIGIN"

  sdk-channel-commit:
    needs: [deploy-service, preflight]
    if: always() && needs.deploy-service.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      IMAGE_REPO: ${{ fromJSON(needs.preflight.outputs.descriptor).ecr.service }}
    outputs:
      commit: ${{ steps.read.outputs.commit }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read the commit this environment runs
        id: read
        run: |
          set -euo pipefail
          TAGS=$(aws ecr describe-images --repository-name "$IMAGE_REPO" \
            --image-ids imageTag=deployed --region "$AWS_REGION" \
            --query 'imageDetails[0].imageTags' --output json)
          COMMIT=$(jq -r '.[] | select(test("^[0-9a-f]{40}$"))' <<<"$TAGS" | head -1)
          if [ -z "$COMMIT" ]; then
            echo "::error::the :deployed image in $IMAGE_REPO carries no commit tag, so what it runs cannot be read: $TAGS"
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "── $IMAGE_REPO:deployed was built from ${COMMIT:0:7}"

  sdk-channel-alignment:
    needs: sdk-channel-commit
    if: always() && needs.sdk-channel-commit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@8c9481d8fd0a9d2461817d3c6ab616af916773de
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Does the dist-tag serving this environment match what it runs?
        run: |
          node eng-tools/assert-sdk-channel-alignment.mjs \
            --env "${{ inputs.environment || 'dev' }}" \
            --deployed-commit "${{ needs.sdk-channel-commit.outputs.commit }}"
