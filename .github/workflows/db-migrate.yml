name: DB migrate

run-name: DB migrate → ${{ inputs.environment }}

on:
  workflow_call:
    inputs:
      source_sha:
        description: "The application commit this run acts on. Also the ref its tooling is checked out at."
        type: string
        required: true
      source_repository:
        description: >-
          Where the application source lives. Defaults to this project; a fork running its own
          deployment passes its own. Only ever read, and the repository is public, so no token.
        type: string
        required: false
        default: 57blocks/soroban-verification-service
      environment:
        description: >-
          Which environment's database to migrate. Required from a caller, with no default: `inputs`
          does not propagate into a called workflow, so a default here would silently migrate dev
          during a staging deploy.
        type: string
        required: true
      target:
        description: >-
          Which database to migrate — verification-svc or query-svc. Required from a
          caller, with no default, for the same reason `environment` has none: deploy.yml must call
          this workflow once per target, explicitly, never relying on a default silently picking one.
        type: string
        required: true
      action:
        type: string
        required: true
      image_repo:
        description: >-
          ECR repository (name only) of the image to run the migration from — deploy.yml passes the
          one it just staged. Split from the digest, never a full reference: the registry hostname
          embeds the account id, and a job output carrying it would be stripped by GitHub's
          secret filter. Omitted by a standalone run, which resolves an image instead.
        type: string
        required: false
        default: ""
      image_digest:
        description: "Digest of the image to run the migration from. Omitted by a standalone run."
        type: string
        required: false
        default: ""
      image_tag:
        description: >-
          Standalone runs only, and optional even then: the tag to migrate from. With none, the
          newest image in the repository by push time — a manual run should not have to know a
          commit SHA to apply already-released migrations.
        type: string
        required: false
        default: ""
    secrets:
      AWS_ACCOUNT_ID:
        description: >-
          The deploy-role fallback's account id. An identifier, not a credential — it is a secret
          only so it stays out of the tree, and the caller passes it explicitly.
        required: false
      SOURCE_APP_ID:
        description: >-
          GitHub App that may read this repository, while it is still private. A caller's own token is
          scoped to the caller, so without this the checkouts below cannot see this project's source.
          Both are unnecessary — and should be deleted — once the repository is public.
        required: false
      SOURCE_APP_PRIVATE_KEY:
        description: "That App's private key."
        required: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      descriptor: ${{ steps.check.outputs.descriptor }}
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@100cfbbad7ab6e1f44613de131a8d2b9e78ecf0b
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      # `--sha` is required: under workflow_call the ambient commit is the caller's.
      - name: Fetch main to prove the ref against
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Refuse a ref that is not on main
        env:
          TARGET_ENV: "${{ inputs.environment }}"
          TARGET_SHA: ${{ inputs.source_sha }}
        run: node eng-tools/assert-deploy-ref.mjs --env "$TARGET_ENV" --sha "$TARGET_SHA"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read the CI descriptor (version handshake)
        id: check
        run: |
          set +e
          DESC=$(bash scripts/ci/load-ci-descriptor.sh "${{ inputs.environment }}" 2,3)
          code=$?
          set -e
          case "$code" in
            0)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              # GitHub drops a job output containing a secret's value, and account_id is one.
              echo "descriptor=$(jq -c 'del(.account_id)' <<<"$DESC")" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              {
                echo "### DB migrate skipped — no CI descriptor for this environment yet"
                echo
                echo "Terraform has not been applied to this environment (no"
                echo "\`/scvs/${{ inputs.environment }}/ci/descriptor\`). Apply"
                echo "soroban-aws-infrastructure first."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              # 4 = AccessDenied, 5 = schema mismatch; the script has named the reason.
              exit 1
              ;;
          esac

  migrate:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      CLUSTER_NAME: ${{ fromJSON(needs.preflight.outputs.descriptor).cluster }}
      SERVICE_ECR_REPOSITORY: ${{ fromJSON(needs.preflight.outputs.descriptor).ecr.service }}
      CONTAINER_NAME: ${{ inputs.target }}
      MIGRATE_FAMILY: ${{ fromJSON(needs.preflight.outputs.descriptor).db_migrate_family_prefix }}${{ inputs.target }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --cluster must be the full ARN: the CI role's ecs:RunTask grant is conditioned on ecs:cluster.
      - name: Resolve the running task definition
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text --region "$AWS_REGION")
          ECS_CLUSTER="arn:aws:ecs:${AWS_REGION}:${ACCOUNT_ID}:cluster/${CLUSTER_NAME}"
          echo "ECS_CLUSTER=$ECS_CLUSTER" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          TD=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$CONTAINER_NAME" \
            --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' \
            --output text)
          if [ -z "$TD" ] || [ "$TD" = "None" ]; then
            echo "::error::Could not resolve the running task definition for $CONTAINER_NAME"
            exit 1
          fi
          echo "TASK_DEFINITION=$TD" >> "$GITHUB_ENV"
          echo "Borrowing: $TD"

      - name: Take this deployment's contracts
        if: inputs.action == 'deploy' && inputs.target == 'query-svc'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-contracts
          path: /tmp/deploy-contracts

      - name: Resolve the image to migrate from
        id: image
        env:
          CALLED_REPO: ${{ inputs.image_repo }}
          CALLED_DIGEST: ${{ inputs.image_digest }}
          MANUAL_TAG: ${{ inputs.image_tag }}
        run: |
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          if [ -n "$CALLED_REPO" ] && [ -n "$CALLED_DIGEST" ]; then
            IMAGE="${REGISTRY}/${CALLED_REPO}@${CALLED_DIGEST}"
          else
            TAG="${MANUAL_TAG:-}"
            if [ -z "$TAG" ]; then
              # Sorted in jq, not --query: the CLI applies --query per 100-image page.
              TAG=$(aws ecr describe-images --repository-name "$SERVICE_ECR_REPOSITORY" \
                --region "$AWS_REGION" --output json \
                | jq -r '.imageDetails | sort_by(.imagePushedAt) | last | .imageTags[0] // empty')
            fi
            if [ -z "$TAG" ]; then
              echo "::error::$SERVICE_ECR_REPOSITORY holds no tagged image to migrate from"
              exit 1
            fi
            IMAGE="${REGISTRY}/${SERVICE_ECR_REPOSITORY}:${TAG}"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Migrating from: $IMAGE"

      - name: Run migration task
        id: run
        env:
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ steps.image.outputs.image }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          case "$ACTION" in
            deploy) PRISMA_CMD="prisma migrate deploy" ;;
            status) PRISMA_CMD="prisma migrate status" ;;
            *) echo "::error::unsupported action '$ACTION'"; exit 1 ;;
          esac

          case "$TARGET" in
            verification-svc) MIGRATE_PACKAGE="packages/db" ;;
            query-svc) MIGRATE_PACKAGE="packages/db-query" ;;
            *) echo "::error::unsupported target '$TARGET'"; exit 1 ;;
          esac

          # Prisma is invoked directly: pnpm is not on PATH in the runtime image.
          COMMAND="cd /app/$MIGRATE_PACKAGE && ./node_modules/.bin/$PRISMA_CMD"

          # Never fall through: the image's trusted-verifiers.local.json would seed localhost URLs and exit 0.
          if [ "$ACTION" = "deploy" ] && [ "$TARGET" = "query-svc" ]; then
            TVL_DOC="/tmp/deploy-contracts/${ENVIRONMENT}/trusted-verifiers.json"

            DECLARED=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" \
              --region "$AWS_REGION" --output json \
              | jq -r '[.taskDefinition.containerDefinitions[]
                        | ((.environment // []) + (.secrets // []))[]
                        | select(.name == "SCVS_TRUSTED_VERIFIERS_SOURCE")] | length')

            if [ -f "$TVL_DOC" ] && [ "$DECLARED" != "0" ]; then
              echo "::error::two Trusted Verifiers Lists are on offer for $ENVIRONMENT — a document in the deploy-contracts artifact AND SCVS_TRUSTED_VERIFIERS_SOURCE on $TASK_DEFINITION. Which verifiers this deployment trusts is not something to resolve by precedence. Remove one."
              exit 1
            elif [ -f "$TVL_DOC" ]; then
              # Validate here: inside the task a bad document fails after the DDL is applied.
              if ! jq -e 'type == "object" and (.verifiers | type) == "array" and (.verifiers | length) > 0' "$TVL_DOC" >/dev/null; then
                echo "::error::$TVL_DOC is not a trusted verifiers list document with a non-empty \`verifiers\` array. An empty list seeds an empty table, and the symptom surfaces later as GET /verifiers returning []."
                exit 1
              fi
              # Overrides are run-task's only channel; pass the exact bytes, never re-serialised.
              TVL_B64=$(base64 < "$TVL_DOC" | tr -d '\n')
              COMMAND="$COMMAND && echo '--- MIGRATE_OK: DDL applied, seeding TVL ---'"
              COMMAND="$COMMAND && printf %s '$TVL_B64' | base64 -d > /tmp/trusted-verifiers.json"
              COMMAND="$COMMAND && cd /app && SCVS_TRUSTED_VERIFIERS_SOURCE=/tmp/trusted-verifiers.json ./node_modules/.bin/tsx scripts/seed-tvl.ts"
              COMMAND="$COMMAND && echo '--- SEED_OK: TVL seed complete ---'"
              echo "Will seed the TVL from this deployment's own document ($(jq -r '.verifiers | length' "$TVL_DOC") verifier(s), $(wc -c <"$TVL_DOC" | tr -d ' ') bytes)"
            elif [ "$DECLARED" != "0" ]; then
              COMMAND="$COMMAND && echo '--- MIGRATE_OK: DDL applied, seeding TVL ---'"
              COMMAND="$COMMAND && cd /app && ./node_modules/.bin/tsx scripts/seed-tvl.ts"
              COMMAND="$COMMAND && echo '--- SEED_OK: TVL seed complete ---'"
              echo "Will seed the TVL from the source $TASK_DEFINITION declares"
            else
              echo "::error::no Trusted Verifiers List for $ENVIRONMENT, so the seed cannot run. Supply it one of two ways, both of which are the caller's: put the document at \`$ENVIRONMENT/trusted-verifiers.json\` in the \`deploy-contracts\` artifact this workflow downloads (alongside \`$ENVIRONMENT/<service>.json\`), or, if you host your list, set SCVS_TRUSTED_VERIFIERS_SOURCE to its https: URL — plus SCVS_TRUSTED_VERIFIERS_SOURCE_SHA256 — on $TASK_DEFINITION. This is not this repository's to supply: the image holds no environment's list."
              exit 1
            fi
          fi

          REGISTER_ARNS=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json "$( \
              aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" --region "$AWS_REGION" \
                --query 'taskDefinition.{containerDefinitions:containerDefinitions,requiresCompatibilities:requiresCompatibilities,networkMode:networkMode,cpu:cpu,memory:memory,executionRoleArn:executionRoleArn,taskRoleArn:taskRoleArn,runtimePlatform:runtimePlatform}' \
                --output json \
              | jq --arg img "$IMAGE" --arg ru "root" --arg fam "$MIGRATE_FAMILY" \
                  '.containerDefinitions |= map(.image=$img | .user=$ru) | .family=$fam' \
            )" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          MIGRATE_TD="$REGISTER_ARNS"

          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER_NAME" \
            --arg cmd "$COMMAND" \
            '{containerOverrides:[{name:$name, command:["sh","-lc",$cmd]}]}')

          OVERRIDES_BYTES=$(printf %s "$OVERRIDES" | wc -c | tr -d ' ')
          if [ "$OVERRIDES_BYTES" -gt 8192 ]; then
            echo "::error::the run-task overrides are ${OVERRIDES_BYTES} bytes and ECS caps them at 8192. The Trusted Verifiers List document planted into the command is what grew. Host the list and declare it as an https: URL with SCVS_TRUSTED_VERIFIERS_SOURCE_SHA256 instead."
            exit 1
          fi

          NETWORK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$CONTAINER_NAME" \
            --region "$AWS_REGION" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json \
            | jq -c '{awsvpcConfiguration:{subnets:.subnets, securityGroups:.securityGroups, assignPublicIp:"DISABLED"}}')

          if [ "$(jq -r '.awsvpcConfiguration.subnets | length' <<<"$NETWORK")" = "0" ]; then
            echo "::error::$CONTAINER_NAME in $ECS_CLUSTER reports no subnets — cannot place the migration task"
            exit 1
          fi

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATE_TD" \
            --launch-type FARGATE \
            --region "$AWS_REGION" \
            --network-configuration "$NETWORK" \
            --overrides "$OVERRIDES" \
            --started-by "gha-db-migrate-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::ECS did not accept the migration task"
            exit 1
          fi
          echo "task=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Task: $TASK_ARN"

          echo "Waiting for it to stop..."
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --region "$AWS_REGION" \
            --query "tasks[0].containers[?name=='${CONTAINER_NAME}'].exitCode | [0]" --output text)
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --region "$AWS_REGION" --query 'tasks[0].stoppedReason' --output text)

          echo "exit_code=$EXIT_CODE stopped_reason=$REASON"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Print migration task logs
        if: always() && steps.run.outputs.task != ''
        env:
          TASK_ARN: ${{ steps.run.outputs.task }}
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
          SEED_SUFFIX: ${{ inputs.action == 'deploy' && inputs.target == 'query-svc' && ' + `seed-tvl`' || '' }}
        run: |
          set -o pipefail
          CONFIG=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query "taskDefinition.containerDefinitions[?name=='${CONTAINER_NAME}'].logConfiguration.options | [0]")
          GROUP=$(echo "$CONFIG" | jq -r '."awslogs-group" // empty')
          PREFIX=$(echo "$CONFIG" | jq -r '."awslogs-stream-prefix" // empty')
          if [ -z "$GROUP" ]; then
            echo "::warning::task definition has no awslogs configuration; cannot fetch logs"
            exit 0
          fi
          STREAM="${PREFIX}/${CONTAINER_NAME}/${TASK_ARN##*/}"
          # pipefail makes this test aws's exit status, not tee's.
          if ! aws logs get-log-events --log-group-name "$GROUP" --log-stream-name "$STREAM" \
            --region "$AWS_REGION" --limit 200 --query 'events[].message' --output text \
            | tee migration.log; then
            echo "::warning::could not fetch CloudWatch logs for $STREAM — the migration task's own success or failure is still authoritative (see exit_code above), but the next step's stage diagnosis (DDL vs TVL seed) will be unreliable since it reads from this log"
            echo "LOG_FETCH_FAILED" > migration.log
          fi
          {
            # Escape every backtick: this is a double-quoted string.
            echo "### \`${TARGET}\` — \`prisma migrate ${ACTION}\`${SEED_SUFFIX} output"
            echo '```'
            cat migration.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the migration task did not succeed
        if: always() && steps.run.outputs.exit_code != '0'
        run: |
          EXIT_CODE="${{ steps.run.outputs.exit_code }}"
          if [ ! -f migration.log ]; then
            echo "::error::migration task exited ${EXIT_CODE} — see the logs above"
            exit 1
          fi
          if grep -q 'LOG_FETCH_FAILED' migration.log; then
            echo "::error::migration task exited ${EXIT_CODE}, but its CloudWatch logs could not be fetched — cannot determine whether DDL or the TVL seed failed. Check the task directly: aws ecs describe-tasks --cluster <cluster> --tasks <task arn>, and retry fetching its logs once CloudWatch has caught up."
            exit 1
          fi
          if grep -q 'SEED_OK' migration.log; then
            echo "::error::migration task exited ${EXIT_CODE} after both DDL and TVL seed reported success — unexpected, see logs above"
          elif grep -q 'MIGRATE_OK' migration.log; then
            echo "::error::DDL migration succeeded but the Trusted Verifiers List seed FAILED — schema is now on the new version but TVL data is stale/missing (schema/code skew). See logs above for the seed error, then re-run this workflow with action=deploy, target=query-svc to retry the seed (the DDL step is idempotent and will no-op)."
          else
            echo "::error::DDL migration failed — see logs above. The Trusted Verifiers List seed was not attempted."
          fi
          exit 1
