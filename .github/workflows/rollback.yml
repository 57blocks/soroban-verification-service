name: Rollback service image

# The run title carries the environment being rolled back.
run-name: Rollback service image → ${{ inputs.environment }}

# It builds nothing and registers nothing.

# Called by the operations repository, which owns the trigger.
on:
  workflow_call:
    inputs:
      source_repository:
        description: >-
          Where the application source lives. Defaults to this project; a fork running its own
          deployment passes its own. Only ever read, and the repository is public, so no token.
        type: string
        required: false
        default: 57blocks/soroban-verification-service
      environment:
        description: "Which environment to roll back."
        type: string
        required: true
      commit_sha:
        description: "Full commit SHA to roll back to — must already be pushed to the registry by a deploy."
        type: string
        required: true
      target:
        description: "Which image to roll back: `service` (all three resident services) or `web`."
        type: string
        required: true
    secrets:
      SOURCE_APP_ID:
        description: >-
          GitHub App that may read this repository, while it is still private. A caller's own token is
          scoped to the caller, so without this the checkouts below cannot see this project's source.
          Both are unnecessary — and should be deleted — once the repository is public.
        required: false
      SOURCE_APP_PRIVATE_KEY:
        description: "That App's private key."
        required: false
permissions:
  id-token: write
  contents: read

# No `concurrency:` here — see deploy.yml's note. The caller must give a rollback the SAME group as a
# deploy of that environment: both end in `update-service`, and the loser would silently win.

env:
  AWS_REGION: ap-southeast-2

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
    steps:
      # `commit_sha` arrives as a free-text dispatch input and ends up as a git ref, an ECR image tag and
      # an argument inside steps that hold AWS credentials. The caller is expected to have resolved it,
      # but a reusable workflow cannot assume its caller did anything.
      - name: Check the commit SHA is a commit SHA
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character commit SHA, got '${COMMIT_SHA}'"
            exit 1
          fi

      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@491a985c0002a083c7f85091c8fbd39e5ffc4fe6
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      # Pure git, no credentials, and placed before the first step that takes any: this environment may
      # only run a commit a release could be cut from. `--sha` is not optional — under `workflow_call`
      # the ambient commit is the CALLER's, which is never on this repository's main.
      - name: Fetch main to prove the ref against
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Refuse a ref that is not on main
        env:
          TARGET_ENV: "${{ inputs.environment }}"
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: node eng-tools/assert-deploy-ref.mjs --env "$TARGET_ENV" --sha "$TARGET_SHA"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read the CI descriptor (version handshake)
        id: descriptor
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          DESC=$(bash scripts/ci/load-ci-descriptor.sh "$TARGET_ENV" 2,3)
          echo "cluster=$(jq -r '.cluster' <<<"$DESC")" >> "$GITHUB_OUTPUT"
          echo "repository=$(jq -r --arg t "$TARGET" '.ecr[$t]' <<<"$DESC")" >> "$GITHUB_OUTPUT"

      - name: Resolve the services this image runs
        id: services
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = "web" ]; then
            echo "names=web" >> "$GITHUB_OUTPUT"
          else
            echo "names=verification-svc orchestrator-svc query-svc" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the digest for ${{ inputs.commit_sha }}
        id: digest
        env:
          REPOSITORY: ${{ steps.descriptor.outputs.repository }}
          # Through `env:`, never `${{ }}` inside the script — this step holds AWS credentials, and an
          # expression is substituted into the shell's source text before the shell ever sees it.
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images --repository-name "$REPOSITORY" \
            --image-ids "imageTag=${COMMIT_SHA}" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::$REPOSITORY has no image tagged ${COMMIT_SHA} — that commit was never deployed to this environment"
            exit 1
          fi
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

      # invariants.md rule 29: CI owns the task definition, and every revision it has ever registered pins an
      # exact commit's digest. Rolling back means finding the ACTIVE revision that pins the target commit's
      # digest and pointing the service at it directly — no alias involved, and none of the running definitions
      # were ever expected to read one.
      - name: Find each service's task definition revision for ${{ inputs.commit_sha }}
        id: revisions
        env:
          SERVICES: ${{ steps.services.outputs.names }}
          DIGEST: ${{ steps.digest.outputs.value }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Every lookup must succeed before anything is written to $GITHUB_OUTPUT: writing a
          # multi-line value opens a heredoc block in that file, and exiting mid-write (as the old
          # version of this step did on a lookup failure) leaves it unterminated — GitHub Actions then
          # fails the step with "Matching delimiter not found", masking the real error below. So the
          # search and the write are two separate phases: nothing is written until every service has
          # resolved.
          RESULTS=""
          for SERVICE in $SERVICES; do
            FAMILY_KEY=$(echo "$SERVICE" | tr '-' '_')
            FAMILY=$(jq -r --arg k "$FAMILY_KEY" '.task_definition_families[$k] // empty' <<<"$CI_DESCRIPTOR_JSON")
            if [ -z "$FAMILY" ]; then
              echo "::error::this environment's descriptor names no task_definition_families entry for $SERVICE"
              exit 1
            fi

            MATCH=""
            for ARN in $(aws ecs list-task-definitions --family-prefix "$FAMILY" --status ACTIVE \
              --query 'taskDefinitionArns' --output text); do
              IMAGE=$(aws ecs describe-task-definition --task-definition "$ARN" \
                --query "taskDefinition.containerDefinitions[?name=='${SERVICE}'].image | [0]" --output text)
              case "$IMAGE" in
                *"@${DIGEST}")
                  MATCH="$ARN"
                  break
                  ;;
              esac
            done

            if [ -z "$MATCH" ]; then
              echo "::error::no ACTIVE revision in $FAMILY pins digest $DIGEST — commit ${COMMIT_SHA} was never deployed to ${TARGET_ENV}, or its revision is no longer ACTIVE"
              exit 1
            fi

            RESULTS="${RESULTS}${SERVICE} ${MATCH}
          "
          done

          {
            echo "arns<<ARNS"
            printf '%s' "$RESULTS"
            echo "ARNS"
          } >> "$GITHUB_OUTPUT"

      # One call per service: TASK_DEFINITION_ARN in roll-service-to-alias.sh is single-service by
      # construction (one revision ARN cannot serve several services), and each service here resolved to
      # its own family's revision above.
      - name: Roll each service onto its resolved revision
        env:
          CLUSTER: ${{ steps.descriptor.outputs.cluster }}
        run: |
          set -euo pipefail
          while read -r SERVICE ARN; do
            [ -n "$SERVICE" ] || continue
            echo "── $SERVICE -> $ARN"
            TASK_DEFINITION_ARN="$ARN" bash scripts/ci/roll-service-to-alias.sh "$CLUSTER" "${{ steps.digest.outputs.value }}" "$SERVICE"
          done <<< "${{ steps.revisions.outputs.arns }}"
