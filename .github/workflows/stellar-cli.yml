name: Build stellar-cli

on:
  workflow_call:
    inputs:
      source_sha:
        description: "The application commit this run acts on. Also the ref its tooling is checked out at."
        type: string
        required: true
      source_repository:
        description: >-
          Where the application source lives. Defaults to this project; a fork running its own
          deployment passes its own. Only ever read, and the repository is public, so no token.
        type: string
        required: false
        default: 57blocks/soroban-verification-service
    secrets:
      AWS_ACCOUNT_ID:
        description: >-
          The deploy-role fallback's account id. An identifier, not a credential — it is a secret
          only so it stays out of the tree, and the caller passes it explicitly.
        required: false
      SOURCE_APP_ID:
        description: >-
          GitHub App that may read `source_repository`. Needed only when that repository is private: a
          caller's own token is scoped to the caller. This project's is public, so the checkouts below
          can read it with the caller's token alone.
        required: false
      SOURCE_APP_PRIVATE_KEY:
        description: "That App's private key."
        required: false

permissions:
  id-token: write
  contents: read

# No `concurrency:`: under workflow_call `github.ref` is the caller's, so a group from it would be one lock for every run.

jobs:
  build:
    name: ${{ matrix.arch }}
    # vars.DEPLOY_ROLE_ARN exists only per environment; without this the role resolves empty.
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@987eedf6794893c97bf4c85ad8c9dfc3ee0cf618
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      # `--sha` is required: under workflow_call the ambient commit is the caller's.
      - name: Fetch main to prove the ref against
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Refuse a ref that is not on main
        env:
          TARGET_ENV: "cli-cache"
          TARGET_SHA: ${{ inputs.source_sha }}
        run: node eng-tools/assert-deploy-ref.mjs --env "$TARGET_ENV" --sha "$TARGET_SHA"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Read the CI descriptor (dev)
        run: |
          DESC=$(bash scripts/ci/load-ci-descriptor.sh dev 2,3)
          echo "$DESC" > /tmp/ci-descriptor.json
          echo "SCVS_CI_CACHE_BUCKET=$(jq -r '.artifacts_bucket' <<<"$DESC")" >> "$GITHUB_ENV"

      - name: Fetch or build, then cache
        env:
          SCVS_CLI_TARGET_ARCH: ${{ matrix.arch }}
        run: scripts/ci/fetch-or-build-stellar-cli.sh

      - name: Report what is now cached
        env:
          SCVS_CLI_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          . docker/stellar-cli.pin
          KEY="scvs-ci/stellar-cli/${STELLAR_CLI_VERSION}/${SCVS_CLI_TARGET_ARCH}/stellar"
          BUCKET="${SCVS_CI_CACHE_BUCKET}"
          arch_upper="$(printf '%s' "$SCVS_CLI_TARGET_ARCH" | tr '[:lower:]' '[:upper:]')"
          binary_var="STELLAR_CLI_BINARY_SHA256_${arch_upper}"
          {
            echo "### \`stellar\` CLI cache — ${SCVS_CLI_TARGET_ARCH}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| bucket | \`${BUCKET}\` |"
            echo "| key | \`${KEY}\` |"
            echo "| sha256 | \`$(cut -d' ' -f1 "docker/prebuilt/bin/${SCVS_CLI_TARGET_ARCH}/stellar.sha256")\` |"
            echo "| pin | \`${STELLAR_CLI_VERSION}\`, official release |"
            echo "| pinned digest | \`${!binary_var}\` (\`${binary_var}\`) |"
            echo
            echo "Consumed by \`docker/service.Dockerfile\` and \`docker/builder.Dockerfile\` through"
            echo "\`COPY docker/prebuilt/bin/\${TARGETARCH}/stellar\`."
          } >> "$GITHUB_STEP_SUMMARY"
