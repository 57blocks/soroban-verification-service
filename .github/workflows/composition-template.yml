name: Composition template gate

on:
  push:
    branches:
      - main
    paths:
      - "docker/composed-environments/**"
      - "services/composer/**"
      - "packages/core/src/build-environment.ts"
      - "eng-tools/check-composition-template.mjs"
      - "eng-tools/check-composition-matrix.mjs"
      - "eng-tools/composition-pairs.mjs"
      - ".github/workflows/composition-template.yml"
  pull_request:
    paths:
      - "docker/composed-environments/**"
      - "services/composer/**"
      - "packages/core/src/build-environment.ts"
      - "eng-tools/check-composition-template.mjs"
      - "eng-tools/check-composition-matrix.mjs"
      - "eng-tools/composition-pairs.mjs"
      - ".github/workflows/composition-template.yml"
  workflow_dispatch:
    inputs:
      cliver:
        description: "Recorded cliver to compose (default: a released one whose rev matches its tag)"
        required: false
      rsver:
        description: "Recorded rsver to compose"
        required: false
      template_version:
        description: "Template version to build (default: CURRENT_COMPOSE_TEMPLATE_VERSION)"
        required: false
      run_matrix:
        description: "Run the whole composition-pairs matrix instead of a single pair"
        required: false
        type: boolean
        default: false
      matrix_only:
        description: "With run_matrix: a single pair id from eng-tools/composition-pairs.mjs"
        required: false

permissions:
  contents: read

concurrency:
  group: composition-template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    if: ${{ !inputs.run_matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scvs/composer... run build
      - run: node eng-tools/check-composition-template.mjs --pins-only
      - run: node --check eng-tools/check-composition-matrix.mjs
      - run: node --check eng-tools/composition-pairs.mjs

  compose:
    if: ${{ !inputs.run_matrix }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scvs/composer... run build

      - name: Compose the current template, smoke-test it, and build a contract in it
        run: |
          node eng-tools/check-composition-template.mjs \
            ${{ inputs.template_version && format('--template-version {0}', inputs.template_version) || '' }} \
            ${{ inputs.cliver && format('--cliver {0}', inputs.cliver) || '' }} \
            ${{ inputs.rsver && format('--rsver {0}', inputs.rsver) || '' }}

  matrix:
    if: ${{ inputs.run_matrix }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scvs/composer... run build

      - name: Probe rustup channel manifests for the template's targets
        run: |
          set -o pipefail
          mkdir -p artifacts/composition-matrix
          node eng-tools/check-composition-matrix.mjs \
            --probe-only \
            --output artifacts/composition-matrix/composition-matrix-probe.json \
            2>&1 | tee artifacts/composition-matrix/composition-matrix-probe.log

      - name: Compose every pair in the matrix
        run: |
          set -o pipefail
          mkdir -p artifacts/composition-matrix
          node eng-tools/check-composition-matrix.mjs \
            --output artifacts/composition-matrix/composition-matrix.json \
            ${{ inputs.matrix_only && format('--only {0}', inputs.matrix_only) || '' }} \
            2>&1 | tee artifacts/composition-matrix/composition-matrix.log

      - name: Upload composition matrix result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composition-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: artifacts/composition-matrix/
