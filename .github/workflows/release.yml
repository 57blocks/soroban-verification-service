name: release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.version != ''
      && format('release {0} (manual{1})', inputs.version, inputs.commit != '' && format(' @ {0}', inputs.commit) || '')
      || startsWith(github.ref, 'refs/tags/') && format('release {0}', github.ref_name)
      || (github.ref == 'refs/heads/main' && 'dev prerelease from main' || format('dry run on {0}', github.ref_name)) }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The release to cut, e.g. v0.1.2 (stable -> latest) or v0.1.2-rc.1 (staging). The run pins the
          tag to main's HEAD and creates the real tag and GitHub release for you. Leave empty to mint a
          dev prerelease from main by hand instead.
        required: false
        default: ""
      commit:
        description: >-
          Release this commit instead of main's HEAD — the one a deploy's channel-alignment check printed,
          so the dist-tag serving an environment can be made to match what it runs. Still has to be an
          ancestor of main.
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-southeast-2

jobs:
  channel:
    name: Resolve the release channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      publish_sdk: ${{ steps.resolve.outputs.publish_sdk }}
      publish_assets: ${{ steps.resolve.outputs.publish_assets }}
      commit: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main to prove the tag against
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Resolve the channel, the version and the dist-tag
        id: resolve
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_COMMIT: ${{ inputs.commit }}
        run: node eng-tools/resolve-release-channel.mjs

  artifacts:
    name: Build and publish release artifacts
    needs: channel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHANNEL: ${{ needs.channel.outputs.channel }}
      SDK_VERSION: ${{ needs.channel.outputs.version }}
      DIST_TAG: ${{ needs.channel.outputs.dist_tag }}
      # Use this, not GITHUB_SHA: a dispatch may release a commit other than the one it started from.
      SDK_COMMIT: ${{ needs.channel.outputs.commit }}
      PUBLISH_SDK: ${{ needs.channel.outputs.publish_sdk == 'true' && github.event.repository.visibility == 'public' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.channel.outputs.commit }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # After the install, before the build: every downstream reader must see the stamped version.
      - name: Stamp the resolved version into the SDK manifest
        if: env.PUBLISH_SDK == 'true'
        run: node eng-tools/stamp-sdk-version.mjs

      - name: Build (topological)
        run: pnpm run build
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: scvs
          POSTGRES_USER: scvs
          POSTGRES_PASSWORD: placeholder

      - name: Test the SDK
        run: pnpm --filter soroban-verification-client run test

      - name: Check SDK packaging
        run: pnpm --filter soroban-verification-client run check:packaging

      - name: Report a release that publishes no package
        if: needs.channel.outputs.publish_sdk == 'true' && env.PUBLISH_SDK != 'true'
        run: |
          echo "::notice::soroban-verification-client@${SDK_VERSION} was built and checked but not published: this repository is still private, and a trusted publish stamps provenance that only a readable source can back. Publishing starts at the flip."

      - name: Generate the OpenAPI specifications
        if: needs.channel.outputs.channel != 'dev'
        run: pnpm run generate:openapi

      - name: Collect the specifications
        if: needs.channel.outputs.channel != 'dev'
        run: |
          mkdir -p release-artifacts
          cp services/verification-svc/openapi.json release-artifacts/verification-svc.openapi.json
          cp services/query-svc/openapi.json release-artifacts/query-svc.openapi.json
          for spec in release-artifacts/*.json; do
            test -s "$spec" || { echo "::error::$spec is empty"; exit 1; }
            node -e "JSON.parse(require('node:fs').readFileSync('$spec','utf8'))" \
              || { echo "::error::$spec is not valid JSON"; exit 1; }
          done
          ls -l release-artifacts

      - name: Upload the specifications for inspection
        if: needs.channel.outputs.channel != 'dev'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-specifications
          path: release-artifacts/*.json
          if-no-files-found: error

      # `gh release upload` needs an existing release, and pushing a tag does not create one.
      - name: Attach the specifications to the release
        if: needs.channel.outputs.publish_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${SDK_VERSION}"
          FLAGS=()
          if [ "${CHANNEL}" != "stable" ]; then FLAGS+=(--prerelease); fi
          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then FLAGS+=(--target "${SDK_COMMIT}"); fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --title "${TAG}" --generate-notes "${FLAGS[@]}"
          fi
          gh release upload "${TAG}" release-artifacts/*.json --clobber

      # Publishing stays last: a published version cannot be undone, so everything that can fail runs first.
      - name: Use an npm that can publish with OIDC
        if: env.PUBLISH_SDK == 'true'
        run: |
          set -euo pipefail
          have=$(npm --version)
          need=11.5.1
          if [ "$(printf '%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm ${have} predates trusted publishing; installing a newer one"
            npm install -g npm@latest
          fi
          npm --version

      - name: Publish soroban-verification-client
        if: env.PUBLISH_SDK == 'true'
        working-directory: clients/sdk
        run: |
          set -euo pipefail

          published() { npm view "soroban-verification-client@${SDK_VERSION}" version >/dev/null 2>&1; }

          if published; then
            FROM=$(npm view "soroban-verification-client@${SDK_VERSION}" scvs.gitSha 2>/dev/null || true)
            if [ "${FROM}" = "${SDK_COMMIT}" ]; then
              echo "::notice::soroban-verification-client@${SDK_VERSION} was already published from this commit — re-verifying only"
            else
              echo "::error::soroban-verification-client@${SDK_VERSION} is already on the registry, built from ${FROM:-a commit it never recorded}, not ${SDK_COMMIT}. A version is immutable: release a new one instead of reusing this."
              exit 1
            fi
          else
            npm publish --dry-run --tag "${DIST_TAG}"
            npm publish --tag "${DIST_TAG}" --provenance

            # `pnpm publish` can exit 0 without publishing, so read the version back.
            if ! published; then
              echo "::error::npm publish reported success but soroban-verification-client@${SDK_VERSION} is not on the registry"
              exit 1
            fi
            echo "::notice::published soroban-verification-client@${SDK_VERSION} under dist-tag \`${DIST_TAG}\`"
          fi

      - name: Verify the channel landed on its dist-tag
        if: env.PUBLISH_SDK == 'true'
        run: node eng-tools/check-published-dist-tags.mjs

      - name: Verify the published SDK installs and runs
        if: env.PUBLISH_SDK == 'true'
        env:
          SCVS_SDK_VERSION: ${{ needs.channel.outputs.version }}
        run: pnpm --filter soroban-verification-client run check:registry-install
