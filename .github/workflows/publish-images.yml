name: Publish images

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# Never cancel a publish in flight: a half-pushed manifest is worse than a queued one.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: service
            dockerfile: docker/service.Dockerfile
            platform: linux/arm64
            tag_suffix: ""
            needs_cli: "true"
          - component: web
            dockerfile: docker/web.Dockerfile
            platform: linux/arm64
            tag_suffix: ""
            needs_cli: "false"
          # Two single-architecture images, never one manifest list: each Batch compute environment is single-architecture.
          - component: builder
            dockerfile: docker/builder.Dockerfile
            platform: linux/arm64
            tag_suffix: "-arm64"
            needs_cli: "false"
          - component: builder
            dockerfile: docker/builder.Dockerfile
            platform: linux/amd64
            tag_suffix: "-amd64"
            needs_cli: "false"
          - component: composer
            dockerfile: docker/composer.Dockerfile
            platform: linux/arm64
            tag_suffix: ""
            needs_cli: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the pinned stellar CLI binary
        if: matrix.needs_cli == 'true'
        env:
          SCVS_CI_CACHE: "off"
          SCVS_CLI_TARGET_ARCH: ${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
        run: scripts/ci/fetch-or-build-stellar-cli.sh

      - name: Set up QEMU
        if: matrix.platform == 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A commit date, not a build date: rebuilding a commit must produce the same stamp.
      - name: Read the console's build stamp
        if: matrix.component == 'web'
        id: stamp
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          DATE=$(TZ=UTC git show -s --date=format-local:%Y-%m-%d --format=%cd HEAD)
          {
            echo "args<<STAMP"
            echo "SCVS_BUILD_COMMIT=${COMMIT}"
            echo "SCVS_BUILD_DATE=${DATE}"
            echo "STAMP"
          } >> "$GITHUB_OUTPUT"
          echo "── the console will carry build ${DATE}.${COMMIT:0:7}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: ${{ steps.stamp.outputs.args }}
          # Both default to true, which makes `outputs.digest` an OCI index rather than the image.
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sv-${{ matrix.component }}:${{ github.sha }}${{ matrix.tag_suffix }}

      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sv-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record what was published
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sv-${{ matrix.component }}
          TAG: ${{ github.sha }}${{ matrix.tag_suffix }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROVENANCE: ${{ github.event.repository.visibility == 'public' && 'attested' || 'not attested — the plan allows it only on a public repository' }}
        run: |
          set -euo pipefail
          {
            echo "### \`sv-${{ matrix.component }}\` (${{ matrix.platform }})"
            echo
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| tag | \`${IMAGE}:${TAG}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| provenance | ${PROVENANCE} |"
            echo
            echo "Resolve it from anywhere, with no credential:"
            echo
            echo '```bash'
            echo "docker buildx imagetools inspect ${IMAGE}:${TAG} --format '{{ .Manifest.Digest }}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
