name: Differential Harness

on:
  workflow_call:
    inputs:
      source_sha:
        description: "The application commit this run acts on. Also the ref its tooling is checked out at."
        type: string
        required: true
      source_repository:
        description: >-
          Where the application source lives. Defaults to this project; a fork running its own
          deployment passes its own. Only ever read, and the repository is public, so no token.
        type: string
        required: false
        default: 57blocks/soroban-verification-service
      host-label:
        description: "Label written into the differential result manifest."
        type: string
        required: false
        default: "github-arm64"
      compare-host-manifests:
        description: "Also run the reproducibility suite. Needs a second manifest already committed under test/differential/results/."
        type: boolean
        required: false
        default: false
      on_main:
        description: >-
          Whether `source_sha` is an ancestor of this repository's main. False runs the harness with no
          AWS credentials at all: the CLI comes straight from the pinned official release, whose digest
          assertions are the same either way. Defaults to true so a caller that does not know must say so.
        type: boolean
        required: false
        default: true
    secrets:
      SOURCE_APP_ID:
        description: >-
          GitHub App that may read this repository, while it is still private. A caller's own token is
          scoped to the caller, so without this the checkouts below cannot see this project's source.
          Both are unnecessary — and should be deleted — once the repository is public.
        required: false
      SOURCE_APP_PRIVATE_KEY:
        description: "That App's private key."
        required: false
permissions:
  id-token: write
  contents: read

# No `concurrency:`: under workflow_call `github.ref` is the caller's, and repeating the caller's group deadlocks.

jobs:
  differential:
    # vars.DEPLOY_ROLE_ARN exists only per environment; without this the role resolves empty.
    environment: dev
    runs-on: ubuntu-24.04-arm
    env:
      SCVS_CI_CACHE: ${{ inputs.on_main && 's3' || 'off' }}
    timeout-minutes: 150
    steps:
      - name: Mint a read token for the application repository
        id: source_token
        uses: 57blocks/soroban-verification-service/.github/actions/source-token@491a985c0002a083c7f85091c8fbd39e5ffc4fe6
        with:
          app_id: ${{ secrets.SOURCE_APP_ID }}
          private_key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          repository: ${{ inputs.source_repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          token: ${{ steps.source_token.outputs.token }}
          ref: ${{ inputs.source_sha }}

      - name: Configure AWS credentials (OIDC)
        if: inputs.on_main
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the harness's dependency closure
        run: npx turbo run build --filter=@scvs/builder

      - name: Run differential harness
        env:
          SCVS_DIFFERENTIAL_HOST_LABEL: ${{ inputs.host-label }}
          SCVS_COMPARE_HOST_MANIFESTS: ${{ inputs.compare-host-manifests && '1' || '0' }}
          AWS_REGION: ap-southeast-2
        run: bash scripts/ci/run-differential-harness.sh

      - name: Upload the host manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-host-manifest-${{ inputs.host-label }}
          path: test/differential/results/*.json
          if-no-files-found: warn
